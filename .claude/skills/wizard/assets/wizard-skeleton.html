<title>{{NAME}} — implementation wizard</title>

<style>
html{font-size:17px}
:root[data-fs="l"]{font-size:19px}
:root[data-fs="xl"]{font-size:21px}

:root{
  --paper:#E6E3DD; --sheet:#F4F2ED; --sheet-2:#ECE9E3; --sheet-3:#DDD9D1;
  --ink:#17161A; --ink-soft:#57545C; --ink-faint:#8C8892;
  --line:#C9C5BC; --line-soft:#DCD8D0;
  --ember:#B8410F; --steel:#1F4E9C; --moss:#3A6B22; --plum:#6E2E7A; --slate:#4A5560; --gold:#8A6408;
  --ember-w:#F7DFD3; --steel-w:#D9E2F5; --moss-w:#DEEAD3; --plum-w:#EEDDF1; --slate-w:#E0E4E8; --gold-w:#F0E7CB;
  --plate:var(--ember); --plate-w:var(--ember-w); --plate-on:#FFFFFF;
  --grain:rgba(23,22,26,.055); --misreg:multiply;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --shadow:0 1px 1px rgba(23,22,26,.05), 0 8px 24px rgba(23,22,26,.07);
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#131215; --sheet:#1A191E; --sheet-2:#201F25; --sheet-3:#2A2830;
    --ink:#EAE7E1; --ink-soft:#9E9AA3; --ink-faint:#6E6A74;
    --line:#302E37; --line-soft:#26242C;
    --ember:#FF8A57; --steel:#7FA3F0; --moss:#84C264; --plum:#C58ED2; --slate:#9AAAB8; --gold:#DCAE3C;
    --ember-w:#3A1D11; --steel-w:#17233F; --moss-w:#1A2C13; --plum-w:#2D1932; --slate-w:#1D242A; --gold-w:#2E2410;
    --plate-on:#0E0D10;
    --grain:rgba(234,231,225,.05); --misreg:screen;
    --shadow:0 1px 1px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.42);
  }
}
:root[data-theme="light"]{
  --paper:#E6E3DD; --sheet:#F4F2ED; --sheet-2:#ECE9E3; --sheet-3:#DDD9D1;
  --ink:#17161A; --ink-soft:#57545C; --ink-faint:#8C8892;
  --line:#C9C5BC; --line-soft:#DCD8D0;
  --ember:#B8410F; --steel:#1F4E9C; --moss:#3A6B22; --plum:#6E2E7A; --slate:#4A5560; --gold:#8A6408;
  --ember-w:#F7DFD3; --steel-w:#D9E2F5; --moss-w:#DEEAD3; --plum-w:#EEDDF1; --slate-w:#E0E4E8; --gold-w:#F0E7CB;
  --plate-on:#FFFFFF; --grain:rgba(23,22,26,.055); --misreg:multiply;
  --shadow:0 1px 1px rgba(23,22,26,.05), 0 8px 24px rgba(23,22,26,.07);
}
:root[data-theme="dark"]{
  --paper:#131215; --sheet:#1A191E; --sheet-2:#201F25; --sheet-3:#2A2830;
  --ink:#EAE7E1; --ink-soft:#9E9AA3; --ink-faint:#6E6A74;
  --line:#302E37; --line-soft:#26242C;
  --ember:#FF8A57; --steel:#7FA3F0; --moss:#84C264; --plum:#C58ED2; --slate:#9AAAB8; --gold:#DCAE3C;
  --ember-w:#3A1D11; --steel-w:#17233F; --moss-w:#1A2C13; --plum-w:#2D1932; --slate-w:#1D242A; --gold-w:#2E2410;
  --plate-on:#0E0D10; --grain:rgba(234,231,225,.05); --misreg:screen;
  --shadow:0 1px 1px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.42);
}

*{box-sizing:border-box}
body{
  margin:0; color:var(--ink); background:var(--paper);
  background-image:radial-gradient(var(--grain) .5px, transparent .5px);
  background-size:4px 4px;
  font-family:var(--sans); font-size:1.03125rem; line-height:1.55; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--plate); outline-offset:2px}
@media (prefers-reduced-motion:reduce){ *{transition:none !important; animation:none !important} }

/* ---------- chrome ---------- */
.bar{position:sticky; top:0; z-index:60; background:color-mix(in srgb,var(--paper) 88%,transparent); backdrop-filter:saturate(1.4) blur(10px); border-bottom:1px solid var(--line)}
.bar-in{max-width:1380px; margin:0 auto; padding:0 clamp(12px,2.4vw,24px); height:56px; display:flex; align-items:center; gap:14px}
.brand{display:flex; align-items:center; gap:9px; font-family:var(--mono); font-size:0.8125rem; letter-spacing:.16em; text-transform:uppercase; white-space:nowrap}
.brand i{width:7px; height:7px; background:var(--ember); border-radius:50%; flex:none; box-shadow:2px 0 0 var(--steel)}
.brand span{color:var(--ink-faint)}
.bar .grow{flex:1; min-width:0}
.sname{font-family:var(--mono); font-size:0.875rem; background:transparent; border:1px solid transparent; border-radius:2px; padding:5px 8px; width:100%; max-width:340px}
.sname:hover{border-color:var(--line)}
.sname:focus{border-color:var(--plate); background:var(--sheet)}
.prog{display:flex; align-items:center; gap:9px; font-family:var(--mono); font-size:0.84375rem; letter-spacing:.1em; color:var(--ink-faint); white-space:nowrap; font-variant-numeric:tabular-nums}
.track{width:88px; height:5px; background:var(--sheet-3); border-radius:99px; overflow:hidden}
.fill{height:100%; width:0; background:var(--plate); transition:width .45s cubic-bezier(.2,.7,.2,1)}
.btn{font-family:var(--mono); font-size:0.84375rem; letter-spacing:.11em; text-transform:uppercase; background:transparent; border:1px solid var(--line); color:var(--ink-soft); padding:8px 12px; border-radius:2px; cursor:pointer; transition:.15s; white-space:nowrap}
.btn:hover{color:var(--ink); border-color:var(--plate)}
.btn.primary{background:var(--plate); border-color:var(--plate); color:var(--plate-on)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{border-color:transparent; color:var(--ink-faint)}
.btn.ghost:hover{color:var(--ink); border-color:var(--line)}
.btn[disabled]{opacity:.34; cursor:not-allowed}
.btn.sm{padding:5px 9px; font-size:0.75rem}
.hide-sm{display:none}
@media(min-width:900px){ .hide-sm{display:inline} }

.rail{display:flex; gap:4px; overflow-x:auto; padding:9px clamp(12px,2.4vw,24px); border-bottom:1px solid var(--line); background:color-mix(in srgb,var(--paper) 72%,transparent); position:sticky; top:56px; z-index:50; scrollbar-width:thin}
.rail button{font-family:var(--mono); font-size:0.8125rem; letter-spacing:.09em; text-transform:uppercase; background:transparent; border:1px solid transparent; color:var(--ink-faint); padding:6px 10px; border-radius:2px; cursor:pointer; white-space:nowrap; transition:.15s}
.rail button:hover{color:var(--ink)}
.rail button[aria-current="true"]{color:var(--plate-on); background:var(--plate); border-color:var(--plate)}
.rail button.done{color:var(--plate)}
.rail button.done::before{content:"\2713\00a0"}

/* ---------- layout ---------- */
.stage{max-width:1380px; margin:0 auto; padding:clamp(16px,2.8vw,30px) clamp(12px,2.4vw,24px) 90px; display:grid; gap:20px; align-items:start}
@media(min-width:1060px){ .stage{grid-template-columns:minmax(0,1fr) minmax(360px,36%)} .col-side{position:sticky; top:112px} }

.panel{background:var(--sheet); border:1px solid var(--line); border-radius:3px; box-shadow:var(--shadow); overflow:hidden}
.panel-head{padding:15px 20px; border-bottom:1px solid var(--line-soft); background:var(--sheet-2); display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
.panel-head .sno{font-family:var(--mono); font-size:0.84375rem; letter-spacing:.14em; color:var(--plate)}
.panel-head h2{font-family:var(--mono); font-size:1rem; letter-spacing:.01em; text-transform:uppercase; margin:0; font-weight:600}
.panel-head .hint{margin-left:auto; font-family:var(--mono); font-size:0.8125rem; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint)}
.panel-body{padding:clamp(16px,2.4vw,24px); display:flex; flex-direction:column; gap:18px}
.nav{display:flex; align-items:center; gap:8px; padding:13px 20px; border-top:1px solid var(--line-soft); background:var(--sheet-2)}
.nav .sp{flex:1}

.lede{font-family:var(--serif); font-size:1.15625rem; line-height:1.5; color:var(--ink-soft); margin:0; max-width:64ch; text-wrap:pretty}
.lede strong{color:var(--ink); font-weight:600}
h3.sec{font-family:var(--mono); font-size:0.8125rem; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-faint); margin:8px 0 -4px; font-weight:600}

/* ---------- fields ---------- */
.f{display:flex; flex-direction:column; gap:6px}
.f > label, .f .flab{font-family:var(--mono); font-size:0.8125rem; letter-spacing:.09em; text-transform:uppercase; color:var(--ink); font-weight:600}
.f .help{font-size:0.96875rem; color:var(--ink-soft); line-height:1.45; margin:-2px 0 2px; max-width:66ch}
.f .help b{color:var(--ink); font-weight:600}
input[type=text], input[type=number], textarea, select{
  width:100%; background:var(--sheet-2); border:1px solid var(--line); border-radius:2px;
  padding:9px 11px; font-size:1rem; transition:.15s;
}
input[type=text]:focus, input[type=number]:focus, textarea:focus, select:focus{border-color:var(--plate); background:var(--sheet)}
textarea{resize:vertical; min-height:74px; line-height:1.5}
.numwrap{display:flex; align-items:stretch; max-width:340px}
.numwrap .pre,.numwrap .suf{display:flex; align-items:center; padding:0 10px; background:var(--sheet-3); border:1px solid var(--line); font-family:var(--mono); font-size:0.875rem; color:var(--ink-soft)}
.numwrap .pre{border-right:0; border-radius:2px 0 0 2px}
.numwrap .suf{border-left:0; border-radius:0 2px 2px 0; white-space:nowrap}
.numwrap input{border-radius:0}
.numwrap .pre + input{border-radius:0}
.numwrap input:first-child{border-radius:2px 0 0 2px}

/* choices */
.opts{display:grid; gap:9px; grid-template-columns:1fr}
@media(min-width:620px){ .opts.two{grid-template-columns:1fr 1fr} }
.opt{position:relative; text-align:left; background:var(--sheet-2); border:1px solid var(--line); border-radius:3px; padding:12px 14px 13px 40px; cursor:pointer; transition:.16s; width:100%; display:block}
.opt:hover{border-color:var(--plate); background:var(--sheet)}
.opt[aria-pressed="true"]{border-color:var(--plate); background:var(--plate-w); box-shadow:inset 3px 0 0 var(--plate)}
.opt .mk{position:absolute; left:13px; top:14px; width:14px; height:14px; border:1.5px solid var(--line); border-radius:50%; transition:.16s}
.opt[aria-pressed="true"] .mk{border-color:var(--plate); background:var(--plate); box-shadow:inset 0 0 0 2.5px var(--plate-w)}
.opt.sq .mk{border-radius:2px}
.opt[aria-pressed="true"].sq .mk{box-shadow:none; background:var(--plate)}
.opt[aria-pressed="true"].sq .mk::after{content:"\2713"; position:absolute; inset:-1px 0 0 1px; color:var(--plate-w); font-size:0.8125rem; line-height:14px; font-weight:700}
.opt h4{margin:0 0 2px; font-size:1rem; font-weight:650; letter-spacing:-.01em}
.opt p{margin:0; font-size:0.9375rem; color:var(--ink-soft); line-height:1.45}
.opt .tag{position:absolute; right:11px; top:11px; font-family:var(--mono); font-size:0.71875rem; letter-spacing:.1em; text-transform:uppercase; color:var(--plate); background:var(--plate-w); padding:2px 6px; border-radius:2px}

/* rows table */
.rows{border:1px solid var(--line); border-radius:3px; overflow:hidden; background:var(--sheet-2)}
.rowsh{display:flex; gap:0; background:var(--sheet-3); border-bottom:1px solid var(--line)}
.rowsh span{font-family:var(--mono); font-size:0.75rem; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); padding:7px 9px; border-right:1px solid var(--line)}
.rowsh span:last-child{border-right:0}
.rw{display:flex; border-bottom:1px solid var(--line-soft)}
.rw:last-of-type{border-bottom:0}
.rw > div{border-right:1px solid var(--line-soft); min-width:0}
.rw > div:last-child{border-right:0}
.rw input{border:0; background:transparent; border-radius:0; padding:8px 9px; font-size:1rem}
.rw input:focus{background:var(--sheet); outline-offset:-2px}
.rw .del{flex:none; width:34px; display:flex; align-items:center; justify-content:center}
.rw .del button{background:transparent; border:0; color:var(--ink-faint); cursor:pointer; font-size:1.03125rem; line-height:1; padding:4px 6px}
.rw .del button:hover{color:var(--ember)}
.rowsf{display:flex; align-items:center; gap:10px; padding:8px 10px; background:var(--sheet-3); border-top:1px solid var(--line)}
.rowsf .tot{margin-left:auto; font-family:var(--mono); font-size:0.8125rem; color:var(--ink-soft); font-variant-numeric:tabular-nums}
.rowsf .tot b{color:var(--ink); font-size:0.96875rem}

/* notes */
.note{border:1px solid var(--line); border-left:3px solid var(--slate); background:var(--sheet-2); border-radius:2px; padding:12px 14px; font-size:1rem; color:var(--ink-soft); line-height:1.5}
.note b{display:block; color:var(--ink); font-family:var(--mono); font-size:0.8125rem; letter-spacing:.12em; text-transform:uppercase; margin-bottom:5px}
.note.warn{border-left-color:var(--ember); background:var(--ember-w)}
.note.warn b{color:var(--ember)}
.note.quote{border-left-color:var(--gold); font-family:var(--serif); font-size:1.0625rem; font-style:italic}
.note.quote b{font-style:normal; color:var(--gold)}
.note.ok{border-left-color:var(--moss); background:var(--moss-w)}
.note.ok b{color:var(--moss)}
.note code{font-family:var(--mono); font-size:0.9375rem; background:var(--sheet-3); padding:1px 4px; border-radius:2px}

/* calculator */
.calc{border:1px solid var(--line); border-radius:3px; background:var(--sheet-2); overflow:hidden}
.calc-h{padding:10px 14px; background:var(--sheet-3); border-bottom:1px solid var(--line); font-family:var(--mono); font-size:0.84375rem; letter-spacing:.12em; text-transform:uppercase; color:var(--ink); font-weight:600; display:flex; gap:10px; align-items:center}
.calc-h em{margin-left:auto; font-style:normal; font-size:0.75rem; color:var(--ink-faint); letter-spacing:.1em}
.calc-in{display:grid; gap:10px; padding:14px; grid-template-columns:1fr}
@media(min-width:560px){ .calc-in{grid-template-columns:1fr 1fr} }
@media(min-width:900px){ .calc-in.three{grid-template-columns:1fr 1fr 1fr} }
.ci{display:flex; flex-direction:column; gap:4px}
.ci label{font-family:var(--mono); font-size:0.75rem; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-faint)}
.calc-out{border-top:1px solid var(--line); background:var(--sheet); padding:14px; display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(128px,1fr))}
.kpi{display:flex; flex-direction:column; gap:2px}
.kpi .v{font-family:var(--mono); font-size:1.59375rem; font-weight:700; letter-spacing:-.03em; line-height:1.1; color:var(--plate); font-variant-numeric:tabular-nums}
.kpi .v.dim{color:var(--ink-faint)}
.kpi .l{font-family:var(--mono); font-size:0.75rem; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint)}
.calc-note{padding:0 14px 14px; font-size:0.9375rem; color:var(--ink-soft); line-height:1.45}
.calc-note b{color:var(--ink)}

/* side column */
.side{display:flex; flex-direction:column; gap:14px}
.card{background:var(--sheet); border:1px solid var(--line); border-radius:3px; box-shadow:var(--shadow); overflow:hidden}
.card-h{padding:11px 15px; border-bottom:1px solid var(--line-soft); background:var(--sheet-2); font-family:var(--mono); font-size:0.84375rem; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-soft); display:flex; align-items:center; gap:8px}
.card-h i{width:6px; height:6px; border-radius:50%; background:var(--plate); flex:none}
.card-b{padding:14px 15px; display:flex; flex-direction:column; gap:11px; font-size:1rem}
.kv{display:flex; gap:10px; align-items:baseline; border-bottom:1px dotted var(--line); padding-bottom:8px}
.kv:last-child{border-bottom:0; padding-bottom:0}
.kv .k{font-family:var(--mono); font-size:0.75rem; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-faint); flex:none; width:96px}
.kv .v{color:var(--ink); min-width:0; word-break:break-word}
.kv .v.empty{color:var(--ink-faint); font-style:italic}
.tri{display:flex; gap:6px}
.tri div{flex:1; text-align:center; padding:9px 5px; border:1px solid var(--line); border-radius:2px; background:var(--sheet-2)}
.tri div.on{border-color:var(--plate); background:var(--plate-w); box-shadow:inset 0 -2px 0 var(--plate)}
.tri div b{display:block; font-family:var(--mono); font-size:0.8125rem; letter-spacing:.1em; text-transform:uppercase; color:var(--ink)}
.tri div span{font-size:0.84375rem; color:var(--ink-faint)}
.tri div.on b{color:var(--plate)}
.seq{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:7px}
.seq li{display:flex; gap:9px; align-items:flex-start; font-size:0.96875rem; color:var(--ink-soft); line-height:1.4}
.seq li i{font-family:var(--mono); font-size:0.75rem; color:var(--plate); flex:none; width:16px; padding-top:2px; font-style:normal}
.seq li.done{color:var(--ink)}
.seq li.done i::before{content:"\2713"}

/* export */
textarea#out, textarea#manualtx{font-family:var(--mono); font-size:0.875rem; line-height:1.5; min-height:220px; background:var(--sheet-2)}
.outbar{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.outbar .t{font-family:var(--mono); font-size:0.8125rem; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); margin-right:auto}
.done-grid{display:grid; gap:10px; grid-template-columns:1fr}
@media(min-width:640px){ .done-grid{grid-template-columns:1fr 1fr} }
.dc{border:1px solid var(--line); border-radius:3px; background:var(--sheet-2); padding:12px 14px}
.dc h5{margin:0 0 4px; font-family:var(--mono); font-size:0.84375rem; letter-spacing:.11em; text-transform:uppercase; color:var(--plate)}
.dc p{margin:0; font-size:0.96875rem; color:var(--ink-soft); line-height:1.45}
.dc p b{color:var(--ink)}

.foot{max-width:1380px; margin:0 auto; padding:0 clamp(12px,2.4vw,24px) 40px; font-size:0.875rem; color:var(--ink-faint); line-height:1.6}
.foot a{color:var(--ink-soft)}
</style>

<div class="bar">
  <div class="bar-in">
    <div class="brand"><i></i>{{NAME}} <span class="hide-sm">&mdash; implementation wizard</span></div>
    <div class="grow"><input class="sname" id="sname" type="text" placeholder="{{PLAN_PLACEHOLDER}}" aria-label="Plan name"></div>
    <div class="prog"><span id="pct">0%</span><span class="track"><i class="fill" id="fill"></i></span></div>
    <button class="btn ghost sm" data-a="fs" type="button" title="Text size" aria-label="Text size">A</button>
    <button class="btn ghost sm" data-a="theme" type="button" title="Toggle light/dark">&#9681;</button>
  </div>
</div>

<nav class="rail" id="rail" aria-label="Steps"></nav>

<main class="stage">
  <section>
    <div class="panel">
      <div class="panel-head">
        <span class="sno" id="sno">STEP 01</span>
        <h2 id="stitle">&nbsp;</h2>
        <span class="hint" id="shint"></span>
      </div>
      <div class="panel-body" id="body"></div>
      <div class="nav">
        <button class="btn" data-a="prev" id="prev" type="button">&larr; Back</button>
        <span class="sp"></span>
        <button class="btn ghost sm" data-a="reset" type="button">Clear</button>
        <button class="btn primary" data-a="next" id="next" type="button">Next &rarr;</button>
      </div>
    </div>
  </section>

  <aside class="col-side">
    <div class="side" id="side"></div>
  </aside>
</main>

<div class="foot">
  Built from <a href="{{SOURCE_URL}}" target="_blank" rel="noopener">&ldquo;{{SOURCE_TITLE}}&rdquo;</a> by {{SOURCE_AUTHOR}}.
  {{FOOT_CAVEAT}}
  Everything you type stays in this browser (localStorage); nothing is sent anywhere.
</div>

<script>
/* ============================================================
   {{NAME}} — implementation wizard
   Single file, no dependencies, state in localStorage.

   AUTHORING MAP — everything you change per wizard is in the four
   blocks marked ▼ AUTHOR. The engine below them never changes.
     1. STEPS      — the whole wizard: steps, copy, fields
     2. CALCS      — live calculators, keyed by {t:"calc", id:"…"}
     3. CALC_MD    — what those calculators add to the exported plan
     4. SIDE       — the sticky right column
   ============================================================ */
var KEY = "{{KEY}}";      /* localStorage key — bump the .vN suffix on breaking changes */
var CUR = "€";            /* currency symbol used by money() */

/* ============================================================
   ▼ AUTHOR 1 — STEPS
   Field types:
     {t:"sec",   label}                                    section heading
     {t:"note",  title, body, tone:""|"warn"|"ok"|"quote"} callout (body may contain HTML)
     {t:"text",  k, label, help?, ph?}                     one-line input
     {t:"area",  k, label, help?, ph?, rows?}              textarea
     {t:"num",   k, label, help?, ph?, pre?, suf?}         number, with prefix/suffix chips
     {t:"choice",k, label, help?, opts:[{v,h?,d,tag?}]}    pick one (click again to clear)
     {t:"multi", k, label, help?, opts:[{v,d,tag?}]}       pick many
     {t:"rows",  k, label, help?, min?, cols:[{k,label,w}]} repeating table, w is a CSS width
     {t:"calc",  id}                                       renders CALCS[id]()
     {t:"export"}                                          the final plan step — exactly one, last
   Only text/area/num/choice/multi/rows count towards progress.
   ============================================================ */
var STEPS = [

{k:"start", nav:"Start", title:"What you are building", hint:"2 minutes",
 lede:"Replace this whole array. One step per decision the source actually forces &mdash; not one per chapter.",
 fields:[
  {t:"note", title:"How to use this", body:"Every step is a decision, not a summary. Nothing is sent anywhere.", tone:"ok"},
  {t:"text", k:"who", label:"Who this is for", help:"Name the buyer specifically enough that a stranger could find ten of them.", ph:"e.g. fencing contractors in NL doing over €1M"},
  {t:"choice", k:"constraint", label:"Your binding constraint", help:"Everything downstream is ordered by this.",
   opts:[{v:"Traffic", d:"Not enough opportunities entering."},
         {v:"System",  d:"Opportunities enter and leak before cash."},
         {v:"Skill",   d:"Cash arrives but delivery does not repeat."}]},
  {t:"area", k:"why", label:"Why now", help:"Two sentences. If you cannot write them, the idea is not ready.", rows:3}
 ]},

{k:"numbers", nav:"Numbers", title:"The numbers", hint:"Be honest",
 lede:"A wizard earns its keep when it does arithmetic the reader would otherwise skip.",
 fields:[
  {t:"num", k:"price", label:"Your price", pre:"€", ph:"3000"},
  {t:"num", k:"cost",  label:"Cost to deliver", pre:"€", ph:"600"},
  {t:"calc", id:"margin"},
  {t:"rows", k:"waste_rows", label:"Where the hours go", min:3,
   cols:[{k:"proc", label:"Process", w:"46%"}, {k:"hrs", label:"Hrs / week", w:"27%"}, {k:"rate", label:"Rate / hr", w:"27%"}]},
  {t:"multi", k:"channels", label:"Channels you will actually run", help:"One of each, not all of them.",
   opts:[{v:"Outreach", d:"Reps and conversations. A treadmill, not a machine."},
         {v:"Content",  d:"Best leads that exist, slowest to arrive."},
         {v:"Paid",     d:"The only dial that responds to money on demand."},
         {v:"Referral", d:"A system, not luck — but useless at three clients."}]}
 ]},

{k:"plan", nav:"Your plan", title:"Your plan", hint:"Take it with you",
 lede:"Everything you entered, as one markdown file.",
 fields:[{t:"export"}]}
];

/* ============================================================
   ▼ AUTHOR 2 — CALCS   id -> function returning calculator HTML
   Helpers available: val(k) num(k,default) money(n) esc(s) rowsOf(k) ci(k,label,value,unit)
   Shape: .calc > .calc-h (+ <em> aside) > .calc-in? > .calc-out (.kpi) > .calc-note
   The note is where the wizard earns trust: say what the number MEANS, and
   say it differently when the number is bad.
   ============================================================ */
var CALCS = {
  margin: function(){
    var p = num("price"), c = num("cost");
    var m = p - c, pct = p ? m / p * 100 : 0;
    return '<div class="calc"><div class="calc-h">Unit economics <em>per sale</em></div>'+
      '<div class="calc-out">'+
        '<div class="kpi"><span class="v">'+(p?money(p):"—")+'</span><span class="l">Price</span></div>'+
        '<div class="kpi"><span class="v'+(m>0?'':' dim')+'">'+(p?money(m):"—")+'</span><span class="l">Margin</span></div>'+
        '<div class="kpi"><span class="v'+(pct>=60?'':' dim')+'">'+(p?Math.round(pct)+"%":"—")+'</span><span class="l">Margin %</span></div>'+
      '</div>'+
      '<div class="calc-note">'+
      (!p ? 'Fill in a price to see whether this is a business or a hobby.'
          : (pct < 50 ? '<b>Under half your price is margin.</b> At this ratio you are buying yourself a job — either the delivery has to shrink or the price has to move.'
                      : 'Healthy on the front end, before anything you sell afterwards.'))+
      '</div></div>';
  }
};

/* Live totals for a {t:"rows"} table, keyed by the row key. Optional.
   Return the HTML for the footer total, or null for no total row. */
var ROW_TOTALS = {
  waste_rows: function(rs){
    var tot = 0;
    for(var i=0;i<rs.length;i++) tot += (parseFloat(rs[i].hrs)||0) * (parseFloat(rs[i].rate)||0) * 52;
    return tot ? 'Annual cost <b>'+money(tot)+'</b>' : null;
  }
};

/* ============================================================
   ▼ AUTHOR 3 — CALC_MD   step key -> extra markdown lines for the export
   Anything a calculator computed that belongs in the downloadable plan.
   ============================================================ */
var CALC_MD = {
  numbers: function(){
    var p = num("price"), c = num("cost");
    if(!p) return [];
    return ["", "- **Unit economics:** price "+money(p)+" · cost "+money(c)+" · margin "+money(p-c)+" ("+Math.round((p-c)/p*100)+"%)"];
  }
};

/* Where to start, shown on the export step and in the markdown. */
function startHere(){
  var c = val("constraint");
  if(c==="Traffic") return "Your constraint is <strong>traffic</strong>. Do not touch delivery yet.";
  if(c==="System")  return "Your constraint is <strong>system</strong>. Fix the leaks before adding volume.";
  if(c==="Skill")   return "Your constraint is <strong>skill</strong>. Deliver it by hand twice before you systematise it.";
  return "Go back to step 1 and pick your binding constraint — everything downstream is ordered by it.";
}

/* Intro and closing lines of the exported markdown. */
function mdIntro(){
  return ["_Built with the {{NAME}} implementation wizard, from “{{SOURCE_TITLE}}” — {{SOURCE_URL}}_"];
}
function mdOutro(){
  return ["_{{FOOT_CAVEAT_PLAIN}}_"];
}

/* ============================================================
   ▼ AUTHOR 4 — SIDE   the sticky right column
   Helpers: card(title, innerHTML) kv(label, value) progressCard()
   Keep it to what changes as they type — a mirror, not a menu.
   ============================================================ */
function renderSide(){
  return card("The decision",
      kv("Buyer", val("who")) +
      kv("Constraint", val("constraint")) +
      kv("Price", val("price") ? money(num("price")) : "")
    ) +
    progressCard();
}

/* ============================================================
   ENGINE — no edits needed below this line
   ============================================================ */
var BYKEY = {}; for(var i=0;i<STEPS.length;i++) BYKEY[STEPS[i].k] = STEPS[i];

/* ---------- state ---------- */
function blank(){ return {name:"", step:0, v:{}}; }
var store = blank();
(function(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){ var p = JSON.parse(raw); if(p && typeof p==="object"){ store = p; store.v = store.v || {}; } }
  }catch(e){}
})();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }
function val(k){ return store.v[k]; }
function setv(k,x){ store.v[k]=x; save(); }

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function num(k, d){ var n = parseFloat(val(k)); return isFinite(n) ? n : (d===undefined?0:d); }
function money(n){
  if(!isFinite(n)) return "—";
  return CUR + Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
}
function slug(s){ return String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60) || "{{SLUG}}-plan"; }
function rowsOf(k){ var r = val(k); return (r && r.length) ? r : []; }
function rowFilled(r){ if(!r) return false; for(var q in r){ if(r[q] && String(r[q]).trim()) return true; } return false; }
function fieldOf(k){
  for(var i=0;i<STEPS.length;i++) for(var j=0;j<STEPS[i].fields.length;j++)
    if(STEPS[i].fields[j].k===k) return STEPS[i].fields[j];
  return null;
}

/* fields that count towards progress */
function countable(f){ return f.t==="text"||f.t==="area"||f.t==="num"||f.t==="choice"||f.t==="multi"||f.t==="rows"; }
function filled(f){
  if(f.t==="rows"){ var rs = rowsOf(f.k); for(var i=0;i<rs.length;i++) if(rowFilled(rs[i])) return true; return false; }
  if(f.t==="multi"){ var a = val(f.k); return !!(a && a.length); }
  var v = val(f.k); return !!(v!==undefined && v!==null && String(v).trim());
}
function stepStats(st){
  var t=0,d=0;
  for(var i=0;i<st.fields.length;i++){ var f=st.fields[i]; if(!countable(f)) continue; t++; if(filled(f)) d++; }
  return {t:t, d:d};
}
function overall(){
  var t=0,d=0;
  for(var i=0;i<STEPS.length;i++){ var s=stepStats(STEPS[i]); t+=s.t; d+=s.d; }
  return {t:t, d:d, pct: t? Math.round(d/t*100):0};
}
function curStepIdx(){ var n = store.step||0; return Math.max(0, Math.min(STEPS.length-1, n)); }
function curStep(){ return STEPS[curStepIdx()]; }

/* ---------- rendering ---------- */
var body = document.getElementById("body");
var rail = document.getElementById("rail");

function renderRail(){
  var h = "";
  for(var i=0;i<STEPS.length;i++){
    var st = STEPS[i], s = stepStats(st);
    var done = s.t>0 && s.d===s.t;
    h += '<button type="button" data-go="'+i+'"'+(i===curStepIdx()?' aria-current="true"':'')+(done&&i!==curStepIdx()?' class="done"':'')+'>'+
         (i<STEPS.length-1 ? ("0"+(i+1)).slice(-2)+" " : "")+esc(st.nav)+'</button>';
  }
  rail.innerHTML = h;
}

function renderFields(fields){
  var h = "";
  for(var i=0;i<fields.length;i++){
    var f = fields[i];
    switch(f.t){
      case "sec": h += '<h3 class="sec">'+esc(f.label)+'</h3>'; break;
      case "note":
        h += '<div class="note '+(f.tone||"")+'"><b>'+esc(f.title)+'</b>'+f.body+'</div>'; break;
      case "text":
        h += '<div class="f"><label for="fld_'+f.k+'">'+esc(f.label)+'</label>'+
             (f.help?'<div class="help">'+f.help+'</div>':'')+
             '<input type="text" id="fld_'+f.k+'" data-k="'+f.k+'" placeholder="'+esc(f.ph||"")+'" value="'+esc(val(f.k)||"")+'"></div>';
        break;
      case "area":
        h += '<div class="f"><label for="fld_'+f.k+'">'+esc(f.label)+'</label>'+
             (f.help?'<div class="help">'+f.help+'</div>':'')+
             '<textarea id="fld_'+f.k+'" data-k="'+f.k+'" rows="'+(f.rows||4)+'" placeholder="'+esc(f.ph||"")+'">'+esc(val(f.k)||"")+'</textarea></div>';
        break;
      case "num":
        h += '<div class="f"><label for="fld_'+f.k+'">'+esc(f.label)+'</label>'+
             (f.help?'<div class="help">'+f.help+'</div>':'')+
             '<div class="numwrap">'+(f.pre?'<span class="pre">'+esc(f.pre)+'</span>':'')+
             '<input type="number" id="fld_'+f.k+'" data-k="'+f.k+'" placeholder="'+esc(f.ph||"")+'" value="'+esc(val(f.k)||"")+'">'+
             (f.suf?'<span class="suf">'+esc(f.suf)+'</span>':'')+'</div></div>';
        break;
      case "choice":
        h += '<div class="f"><span class="flab">'+esc(f.label)+'</span>'+
             (f.help?'<div class="help">'+f.help+'</div>':'')+'<div class="opts'+(f.opts.length>2?'':' two')+'">';
        for(var a=0;a<f.opts.length;a++){
          var o = f.opts[a], on = val(f.k)===o.v;
          h += '<button type="button" class="opt" data-pick="'+f.k+'" data-v="'+esc(o.v)+'" aria-pressed="'+(on?"true":"false")+'">'+
               '<span class="mk"></span>'+(o.tag?'<span class="tag">'+esc(o.tag)+'</span>':'')+
               '<h4>'+esc(o.h||o.v)+'</h4><p>'+esc(o.d)+'</p></button>';
        }
        h += '</div></div>';
        break;
      case "multi":
        var sel = val(f.k) || [];
        h += '<div class="f"><span class="flab">'+esc(f.label)+'</span>'+
             (f.help?'<div class="help">'+f.help+'</div>':'')+'<div class="opts">';
        for(var b=0;b<f.opts.length;b++){
          var o2 = f.opts[b], on2 = sel.indexOf(o2.v)>=0;
          h += '<button type="button" class="opt sq" data-toggle="'+f.k+'" data-v="'+esc(o2.v)+'" aria-pressed="'+(on2?"true":"false")+'">'+
               '<span class="mk"></span>'+(o2.tag?'<span class="tag">'+esc(o2.tag)+'</span>':'')+
               '<h4>'+esc(o2.v)+'</h4><p>'+esc(o2.d)+'</p></button>';
        }
        h += '</div></div>';
        break;
      case "rows": h += renderRows(f); break;
      case "calc": h += renderCalc(f.id); break;
      case "export": h += renderExport(); break;
    }
  }
  return h;
}

function renderRows(f){
  var rs = rowsOf(f.k).slice();
  while(rs.length < (f.min||3)) rs.push({});
  var h = '<div class="f"><span class="flab">'+esc(f.label)+'</span>'+
          (f.help?'<div class="help">'+f.help+'</div>':'')+'<div class="rows" data-rows="'+f.k+'"><div class="rowsh">';
  for(var c=0;c<f.cols.length;c++) h += '<span style="width:'+f.cols[c].w+'">'+esc(f.cols[c].label)+'</span>';
  h += '<span style="width:34px"></span></div>';
  for(var r=0;r<rs.length;r++){
    h += '<div class="rw">';
    for(var c2=0;c2<f.cols.length;c2++){
      var col = f.cols[c2];
      h += '<div style="width:'+col.w+'"><input type="text" data-rk="'+f.k+'" data-ri="'+r+'" data-rc="'+col.k+'" value="'+esc(rs[r][col.k]||"")+'" aria-label="'+esc(col.label)+' row '+(r+1)+'"></div>';
    }
    h += '<div class="del"><button type="button" data-rowdel="'+f.k+'" data-ri="'+r+'" title="Remove row">&times;</button></div></div>';
  }
  var tot = ROW_TOTALS[f.k] ? ROW_TOTALS[f.k](rs) : null;
  h += '<div class="rowsf"><button class="btn sm" type="button" data-rowadd="'+f.k+'">+ Row</button>'+
       (tot?'<span class="tot">'+tot+'</span>':'')+'</div></div></div>';
  return h;
}

function renderCalc(id){ return CALCS[id] ? CALCS[id]() : ""; }

/* one labelled number input inside a .calc-in block */
function ci(k, label, v, unit){
  var isPct = unit==="%";
  return '<div class="ci"><label>'+esc(label)+'</label><div class="numwrap">'+
    (isPct?'':'<span class="pre">'+esc(unit||CUR)+'</span>')+
    '<input type="number" data-k="'+k+'" value="'+esc(v===undefined||v===null?"":v)+'">'+
    (isPct?'<span class="suf">%</span>':'')+'</div></div>';
}

/* ---------- export step ---------- */
function renderExport(){
  var o = overall();
  var gaps = [];
  for(var i=0;i<STEPS.length-1;i++){
    var s = stepStats(STEPS[i]);
    if(s.t && s.d < s.t) gaps.push(STEPS[i].nav+" ("+s.d+"/"+s.t+")");
  }
  return '<div class="done-grid">'+
    '<div class="dc"><h5>Completed</h5><p><b>'+o.d+' of '+o.t+'</b> fields across '+(STEPS.length-1)+' steps.</p></div>'+
    '<div class="dc"><h5>Still open</h5><p>'+(gaps.length?esc(gaps.join(" · ")):"Nothing — every step is filled.")+'</p></div>'+
    '</div>'+
    '<div class="note"><b>Where to start</b>'+startHere()+'</div>'+
    '<div class="f"><span class="flab">Your plan, as markdown</span><textarea id="out" readonly aria-label="Your plan in markdown"></textarea></div>'+
    '<div class="outbar"><span class="t" id="outlen"></span>'+
    '<button class="btn" type="button" data-a="copy">Copy</button>'+
    '<button class="btn primary" type="button" data-a="download">Download .md</button></div>'+
    '<div id="manual"></div>';
}

/* ---------- markdown ---------- */
function markdown(){
  var L = [], o = overall();
  L.push("# "+(store.name || "{{NAME}} plan"));
  L.push("");
  L = L.concat(mdIntro());
  L.push("");
  L.push("**Completeness:** "+o.d+"/"+o.t+" fields ("+o.pct+"%)");
  L.push("");
  L.push("---");

  for(var i=0;i<STEPS.length-1;i++){
    var st = STEPS[i];
    var chunk = [];
    for(var j=0;j<st.fields.length;j++){
      var f = st.fields[j];
      if(!countable(f) || !filled(f)) continue;
      /* a block (list, table, quote) after a bullet needs a blank line or it joins the list */
      if(f.t!=="text" && f.t!=="num" && f.t!=="choice" && chunk.length && chunk[chunk.length-1]) chunk.push("");
      if(f.t==="multi"){
        var sel = val(f.k)||[];
        chunk.push("**"+f.label+"**"); chunk.push("");
        for(var a=0;a<sel.length;a++) chunk.push("- "+sel[a]);
        chunk.push("");
      } else if(f.t==="rows"){
        var rs = rowsOf(f.k).filter(rowFilled);
        if(!rs.length) continue;
        chunk.push("**"+f.label+"**"); chunk.push("");
        chunk.push("| "+f.cols.map(function(c){return c.label;}).join(" | ")+" |");
        chunk.push("|"+f.cols.map(function(){return "---";}).join("|")+"|");
        for(var r=0;r<rs.length;r++){
          chunk.push("| "+f.cols.map(function(c){ return String(rs[r][c.k]||"").replace(/\|/g,"\\|"); }).join(" | ")+" |");
        }
        chunk.push("");
      } else if(f.t==="area"){
        chunk.push("**"+f.label+"**"); chunk.push("");
        var lines = String(val(f.k)).split(/\n/);
        for(var q=0;q<lines.length;q++) chunk.push("> "+lines[q]);
        chunk.push("");
      } else {
        var pre = f.pre||"", suf = f.suf?(" "+f.suf):"";
        chunk.push("- **"+f.label+":** "+pre+String(val(f.k))+suf);
      }
    }
    if(CALC_MD[st.k]) chunk = chunk.concat(CALC_MD[st.k]());
    while(chunk.length && !chunk[0]) chunk.shift();
    if(!chunk.length) continue;
    L.push("");
    L.push("## "+(i+1)+" · "+st.title);
    L.push("");
    L = L.concat(chunk);
  }

  L.push("");
  L.push("---");
  L.push("");
  L.push("## Where to start");
  L.push("");
  L.push(startHere().replace(/<\/?(b|strong)>/g,"**"));
  L.push("");
  L = L.concat(mdOutro());
  return L.join("\n");
}

/* ---------- side column ---------- */
function card(title, inner){
  return '<div class="card"><div class="card-h"><i></i>'+esc(title)+'</div><div class="card-b">'+inner+'</div></div>';
}
function kv(k,v){
  return '<div class="kv"><span class="k">'+esc(k)+'</span><span class="v'+(v?'':' empty')+'">'+esc(v||"not set")+'</span></div>';
}
function seqList(items){
  var h = "";
  for(var i=0;i<items.length;i++) h += '<li class="'+(items[i].ok?"done":"")+'"><i>'+(items[i].ok?"":("0"+(i+1)).slice(-2))+'</i><span>'+esc(items[i].t)+'</span></li>';
  return '<ul class="seq">'+h+'</ul>';
}
function progressCard(){
  var o = overall();
  return card("Progress",
    '<div class="kv"><span class="k">Filled</span><span class="v">'+o.d+' / '+o.t+' fields</span></div>'+
    '<div class="track" style="width:100%"><i class="fill" style="width:'+o.pct+'%"></i></div>');
}
function repaintSide(){ document.getElementById("side").innerHTML = renderSide(); }

/* ---------- paint ---------- */
function paint(){
  var st = curStep(), idx = curStepIdx();
  document.getElementById("sno").textContent = "STEP "+("0"+(idx+1)).slice(-2)+" / "+("0"+STEPS.length).slice(-2);
  document.getElementById("stitle").textContent = st.title;
  document.getElementById("shint").textContent = st.hint||"";
  body.innerHTML = (st.lede ? '<p class="lede">'+st.lede+'</p>' : "") + renderFields(st.fields);

  document.getElementById("prev").disabled = idx===0;
  var nx = document.getElementById("next");
  nx.textContent = idx===STEPS.length-1 ? "Done" : "Next →";
  nx.disabled = idx===STEPS.length-1;

  bumpProgress();
  repaintSide();

  if(st.fields.length && st.fields[st.fields.length-1].t==="export"){
    var md = markdown(), out = document.getElementById("out");
    if(out){ out.value = md; document.getElementById("outlen").textContent = md.length+" characters"; }
  }
  window.scrollTo({top:0, behavior:"instant"});
}

/* ---------- events ---------- */
document.addEventListener("input", function(e){
  var t = e.target;
  if(t.id==="sname"){ store.name = t.value; save(); return; }

  var k = t.getAttribute("data-k");
  if(k){
    setv(k, t.value);
    repaintCalcs();
    bumpProgress(); repaintSide();
    return;
  }
  var rk = t.getAttribute("data-rk");
  if(rk){
    var ri = parseInt(t.getAttribute("data-ri"),10), rc = t.getAttribute("data-rc");
    var arr = (val(rk)||[]).slice();
    while(arr.length<=ri) arr.push({});
    arr[ri] = Object.assign({}, arr[ri]); arr[ri][rc] = t.value;
    setv(rk, arr);
    repaintRowTotal(rk);
    repaintCalcs();
    bumpProgress(); repaintSide();
  }
});

document.addEventListener("click", function(e){
  var t = e.target.closest ? e.target.closest("[data-a],[data-go],[data-pick],[data-toggle],[data-rowadd],[data-rowdel]") : null;
  if(!t) return;

  var go = t.getAttribute("data-go");
  if(go!==null && go!==undefined){ store.step = parseInt(go,10); save(); paint(); return; }

  var pick = t.getAttribute("data-pick");
  if(pick){
    var v = t.getAttribute("data-v");
    setv(pick, val(pick)===v ? "" : v);
    paint(); return;
  }
  var tog = t.getAttribute("data-toggle");
  if(tog){
    var v2 = t.getAttribute("data-v");
    var arr = (val(tog)||[]).slice();
    var i2 = arr.indexOf(v2);
    if(i2>=0) arr.splice(i2,1); else arr.push(v2);
    setv(tog, arr);
    t.setAttribute("aria-pressed", i2>=0 ? "false" : "true");
    repaintCalcs(); bumpProgress(); repaintSide();
    return;
  }
  var add = t.getAttribute("data-rowadd");
  if(add){
    var f = fieldOf(add), a2 = (val(add)||[]).slice();
    while(a2.length < ((f&&f.min)||3)) a2.push({});
    a2.push({}); setv(add, a2); paint(); return;
  }
  var del = t.getAttribute("data-rowdel");
  if(del){
    var ri2 = parseInt(t.getAttribute("data-ri"),10);
    var a3 = (val(del)||[]).slice();
    if(a3.length>ri2) a3.splice(ri2,1);
    setv(del, a3); paint(); return;
  }

  switch(t.getAttribute("data-a")){
    case "next": if(curStepIdx()<STEPS.length-1){ store.step=curStepIdx()+1; save(); paint(); } break;
    case "prev": if(curStepIdx()>0){ store.step=curStepIdx()-1; save(); paint(); } break;
    case "theme": toggleTheme(); break;
    case "fs": cycleSize(); break;
    /* data-src="#someTextarea" copies that field instead of the whole plan —
       used by prompt generators inside calculators */
    case "copy":
      var src = t.getAttribute("data-src");
      var el = src ? document.querySelector(src) : null;
      copy(el ? (el.value!==undefined ? el.value : el.textContent) : markdown(), t);
      break;
    case "download": download(); break;
    case "reset":
      if(confirm("Clear this plan? Everything you typed is deleted from this browser.")){
        store = blank(); save(); document.getElementById("sname").value=""; paint();
      }
      break;
  }
});

function bumpProgress(){
  var o = overall();
  document.getElementById("pct").textContent = o.pct+"%";
  document.getElementById("fill").style.width = o.pct+"%";
  renderRail();
}

/* re-render calculators in place, without stealing focus from the field being typed in */
function repaintCalcs(){
  var st = curStep(), ids = [];
  for(var j=0;j<st.fields.length;j++) if(st.fields[j].t==="calc") ids.push(st.fields[j].id);
  if(!ids.length) return;
  var active = document.activeElement;
  var nodes = body.querySelectorAll(".calc");
  for(var n=0;n<nodes.length;n++){
    if(!ids[n]) continue;
    var tmp = document.createElement("div"); tmp.innerHTML = renderCalc(ids[n]);
    var fresh = tmp.firstChild;
    if(!fresh) continue;
    if(nodes[n].contains(active)){
      /* never replace the block you are typing in — swap only the computed parts */
      var live = nodes[n];
      ["calc-out","calc-note"].forEach(function(cls){
        var a = live.querySelector("."+cls), b = fresh.querySelector("."+cls);
        if(a && b) a.innerHTML = b.innerHTML;
      });
      continue;
    }
    nodes[n].parentNode.replaceChild(fresh, nodes[n]);
  }
}

/* update a rows table's footer total without re-rendering its inputs */
function repaintRowTotal(rk){
  if(!ROW_TOTALS[rk]) return;
  var box = body.querySelector('[data-rows="'+rk+'"]');
  if(!box) return;
  var html = ROW_TOTALS[rk](rowsOf(rk));
  var foot = box.querySelector(".rowsf"), tot = foot.querySelector(".tot");
  if(!html){ if(tot) tot.remove(); return; }
  if(!tot){ tot = document.createElement("span"); tot.className = "tot"; foot.appendChild(tot); }
  tot.innerHTML = html;
}

/* ---------- output helpers ---------- */
function copy(text, btn){
  var done = function(){ var o = btn.textContent; btn.textContent = "Copied"; setTimeout(function(){ btn.textContent = o; }, 1400); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, function(){ fallback(text); done(); });
  } else { fallback(text); done(); }
}
function fallback(text){
  var ta = document.createElement("textarea");
  ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
}
function download(){
  var md = markdown(), name = slug(store.name)+".md", worked = false;
  try{
    var blob = new Blob([md], {type:"text/markdown;charset=utf-8"});
    var url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = name; a.rel = "noopener";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    worked = true;
  }catch(e){ worked = false; }
  /* Embedded pages block file downloads, and the block is silent — always offer the manual path there. */
  if(!worked || window.self !== window.top) manualSave(md, name);
}
function manualSave(md, name){
  var host = document.getElementById("manual");
  if(!host) return;
  host.innerHTML =
    '<div class="note warn"><b>If nothing saved</b>This page is embedded, and browsers block file downloads inside an embedded page. '+
    'Copy the text below and save it as <code>'+esc(name)+'</code> — it is the same file.</div>'+
    '<textarea id="manualtx" rows="10" readonly aria-label="Your plan in markdown"></textarea>'+
    '<div class="outbar"><span class="t">'+md.length+' characters</span>'+
    '<button class="btn primary" data-a="copy" type="button">Copy the plan</button></div>';
  var tx = document.getElementById("manualtx");
  tx.value = md; tx.focus(); tx.select();
}
/* text size — one root font-size knob; every size in the CSS is rem */
var FS = ["m","l","xl"];
function applySize(v){
  var r = document.documentElement;
  if(v==="m") r.removeAttribute("data-fs"); else r.setAttribute("data-fs", v);
  var b = document.querySelector('[data-a="fs"]');
  if(b) b.textContent = v==="m" ? "A" : (v==="l" ? "A+" : "A++");
}
function cycleSize(){
  var cur = document.documentElement.getAttribute("data-fs") || "m";
  var next = FS[(FS.indexOf(cur)+1) % FS.length];
  applySize(next);
  try{ localStorage.setItem(KEY+".fs", next); }catch(e){}
}
function toggleTheme(){
  var r = document.documentElement;
  var cur2 = r.getAttribute("data-theme");
  var sysDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  var next = cur2 ? (cur2==="dark" ? "light" : "dark") : (sysDark ? "light" : "dark");
  r.setAttribute("data-theme", next);
  try{ localStorage.setItem(KEY+".theme", next); }catch(e){}
}

/* ---------- boot ---------- */
(function(){
  try{ var th = localStorage.getItem(KEY+".theme"); if(th) document.documentElement.setAttribute("data-theme", th); }catch(e){}
  try{ applySize(localStorage.getItem(KEY+".fs") || "m"); }catch(e){ applySize("m"); }
  document.getElementById("sname").value = store.name || "";
  paint();
})();
</script>
