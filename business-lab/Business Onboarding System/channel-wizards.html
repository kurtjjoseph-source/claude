<title>Kanalen instellen — Vision Outreach Media</title>
<style>
  :root{
    --ground:#F6F8F7; --surface:#FFFFFF; --ink:#22302B; --muted:#5E6E67;
    --line:#DCE4E0; --accent:#1B6E53; --accent-ink:#FFFFFF; --accent-soft:#E4F0EB;
    --note-bg:#FBF3DF; --note-ink:#7A5200; --note-line:#EBDCB4;

  }
  @media (prefers-color-scheme: dark){
    :root{
      --ground:#141A17; --surface:#1D2521; --ink:#E6ECE8; --muted:#93A29B;

      --note-bg:#2C2517; --note-ink:#E4C376; --note-line:#453A20;

    }
  }
  :root[data-theme="light"]{
    --ground:#F6F8F7; --surface:#FFFFFF; --ink:#22302B; --muted:#5E6E67;
    --line:#DCE4E0; --accent:#1B6E53; --accent-ink:#FFFFFF; --accent-soft:#E4F0EB;
    --note-bg:#FBF3DF; --note-ink:#7A5200; --note-line:#EBDCB4;
    --done:#1B6E53; --chip-bg:#EEF3F1; --shadow:0 1px 3px rgba(34,48,43,.08);
  }
  :root[data-theme="dark"]{
    --ground:#141A17; --surface:#1D2521; --ink:#E6ECE8; --muted:#93A29B;
    --line:#2E3934; --accent:#4FC795; --accent-ink:#0E1512; --accent-soft:#1F332B;
    --note-bg:#2C2517; --note-ink:#E4C376; --note-line:#453A20;
    --done:#4FC795; --chip-bg:#252E29; --shadow:0 1px 3px rgba(0,0,0,.35);
  }
  html{background:var(--ground);}
  body{
    margin:0; background:var(--ground); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:20px; line-height:1.5;

  }
  .app{max-width:460px; margin:0 auto; padding:0 16px 56px;}

  }
  .brand{display:flex; flex-direction:column; gap:1px;}
  .brand .org{font-size:12px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); font-weight:600;}
  .brand .title{font-size:17px; font-weight:700;}
  .langs{display:flex; gap:2px; background:var(--surface); border:1px solid var(--line); border-radius:99px; padding:3px;}
  .langs button{

    padding:4px 12px; border-radius:99px; cursor:pointer;
  }
  .langs button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink);}
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:22px 20px; margin-bottom:14px;
  }
  h1{font-size:26px; line-height:1.25; margin:0 0 10px; text-wrap:balance;}
  h2{font-size:22px; line-height:1.3; margin:0 0 8px; text-wrap:balance;}
  p{margin:0 0 12px;}
  p:last-child{margin-bottom:0;}
  .muted{color:var(--muted);}
  .small{font-size:16px;}
  .eyebrow{font-size:12px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); font-weight:600; margin-bottom:6px;}

    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:16px; margin-top:2px;

    display:block; width:100%; box-sizing:border-box; text-align:center;
    font:inherit; font-weight:700; font-size:20px;
    border-radius:12px; padding:15px 18px; cursor:pointer; border:1px solid transparent;
    text-decoration:none;
  }
  .btn + .btn{margin-top:10px;}
  .btn.primary{background:var(--accent); color:var(--accent-ink);}
  .btn.secondary{background:var(--surface); color:var(--ink); border-color:var(--line);}
  .btn.link{background:transparent; color:var(--accent); border:0; font-size:17px; padding:10px;}
  .btn:focus-visible, .chip button:focus-visible, .langs button:focus-visible, .chan:focus-visible{
    outline:3px solid var(--accent); outline-offset:2px;
  }

  .chanlist{display:flex; flex-direction:column; gap:10px;}
  .chan{
    display:flex; align-items:center; gap:14px; width:100%; box-sizing:border-box; text-align:left;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 16px; cursor:pointer; font:inherit; color:var(--ink); box-shadow:var(--shadow);
  }
  .chan .badge{
    flex:0 0 auto; width:46px; height:46px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:19px; background:var(--accent-soft); color:var(--accent);
  }
  .chan .meta{flex:1 1 auto; min-width:0;}
  .chan .name{font-weight:700; font-size:19px;}
  .chan .state{font-size:15px; color:var(--muted); font-variant-numeric:tabular-nums;}
  .chan .state.done{color:var(--done); font-weight:700;}
  .chan .arrow{color:var(--muted); font-size:20px;}
  .chan.upcoming{opacity:.55; cursor:default; box-shadow:none;}
  .chan.upcoming .badge{background:var(--chip-bg); color:var(--muted);}
  .chan .soon{
    flex:0 0 auto; font-size:13px; font-weight:700; letter-spacing:.04em;
    color:var(--muted); border:1px solid var(--line); border-radius:99px; padding:4px 10px;
  }

  .progress{display:flex; gap:6px; margin:2px 0 16px;}
  .progress span{height:6px; border-radius:3px; flex:1; background:var(--line);}
  .progress span.on{background:var(--accent);}

  .chips{display:flex; flex-direction:column; gap:10px; margin:14px 0;}
  .chip{
    display:flex; align-items:center; gap:10px;
    background:var(--chip-bg); border:1px dashed var(--line); border-radius:10px; padding:10px 12px;
  }
  .chip .val{flex:1 1 auto; min-width:0; overflow-wrap:anywhere;}
  .chip .lab{display:block; font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:600;}
  .chip .tx{font-weight:600; font-size:18px;}
  .chip button{
    flex:0 0 auto; font:inherit; font-size:15px; font-weight:700;
    background:var(--surface); color:var(--accent); border:1px solid var(--line);
    border-radius:8px; padding:8px 12px; cursor:pointer;
  }
  .note{
    background:var(--note-bg); color:var(--note-ink); border:1px solid var(--note-line);
    border-radius:10px; padding:12px 14px; font-size:16px; line-height:1.45; margin:14px 0 0;
  }
  .note b{font-weight:800;}
  .wait{
    display:flex; gap:12px; align-items:flex-start; background:var(--accent-soft);
    border-radius:10px; padding:12px 14px; font-size:16px; margin:14px 0 0; color:var(--ink);
  }
  .detail{display:flex; flex-direction:column; gap:12px; margin-top:14px;}
  .drow{
    background:var(--chip-bg); border:1px solid var(--line); border-radius:10px; padding:10px 12px;
    display:flex; align-items:center; gap:10px;
  }
  .drow .val{flex:1 1 auto; min-width:0; overflow-wrap:anywhere;}
  .drow .lab{display:block; font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:600;}
  .drow .tx{font-weight:600; font-size:18px;}
  .drow button{
    flex:0 0 auto; font:inherit; font-size:15px; font-weight:700;
    background:var(--surface); color:var(--accent); border:1px solid var(--line);
    border-radius:8px; padding:8px 12px; cursor:pointer;
  }
  .drow .fixed{flex:0 0 auto; font-size:13px; color:var(--muted); font-weight:600;}
  .drow.editing{flex-direction:column; align-items:stretch;}
  .drow input{
    font:inherit; font-size:18px; font-weight:600; color:var(--ink);
    background:var(--surface); border:1px solid var(--accent); border-radius:8px; padding:10px 12px;
    width:100%; box-sizing:border-box; margin-top:6px;
  }
  .drow input:focus{outline:3px solid var(--accent); outline-offset:1px;}
  .editrow{display:flex; gap:8px; margin-top:10px;}
  .editrow .btn{margin:0; padding:11px 14px; font-size:17px; flex:1;}
  .flash{
    background:var(--accent-soft); color:var(--ink); border-radius:8px;
    padding:9px 12px; font-size:15px; margin-top:8px;
  }
  .statusline{display:flex; align-items:center; gap:10px; margin:2px 0 4px;}
  .statusline .dot{
    width:30px; height:30px; border-radius:50%; background:var(--accent-soft); color:var(--done);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:16px; flex:0 0 auto;
  }
  .statusline .st{font-size:16px; color:var(--muted);}
  .donebig{
    width:64px; height:64px; border-radius:50%; background:var(--accent-soft); color:var(--done);
    display:flex; align-items:center; justify-content:center; font-size:32px; font-weight:800; margin:4px auto 14px;
  }
  .center{text-align:center;}
  footer.demo{margin-top:26px; font-size:14px; color:var(--muted); text-align:center; line-height:1.5;}
  .backrow{margin-bottom:6px;}
  .backrow .btn{width:auto; display:inline-block; padding-left:2px;}
  @media (prefers-reduced-motion: no-preference){
    .card, .chan{transition:transform .12s ease;}
    .chan:active{transform:scale(.985);}
  }
</style>

/* ---- Detail fields per completed channel ---- */
function detailFields(c){
  const f = [];
  const push = (k, nl, en, val, fixed) => f.push({k, lab:{nl, en}, val, fixed:!!fixed});
  if (c.id === "gbp"){
    push("name","Naam","Name", KIT.org);
    push("cat","Soort","Category", KIT.category_nl);
    push("addr","Adres","Address", KIT.address);
    push("phone","Telefoon","Phone", KIT.phone);
    push("site","Website","Website", KIT.site);
    push("mgr","Beheerder","Manager", KIT.vomMail, true);
  } else if (c.id === "fb"){
    push("name","Naam","Name", KIT.org);
    push("cat","Soort","Category", KIT.category_nl);
    push("bio","Tekst","Text", KIT.bio_nl);
    push("site","Website","Website", KIT.site);
  } else if (c.id === "ig"){
    push("user","Gebruikersnaam","Username", KIT.handle);
    push("name","Naam","Name", KIT.org);
    push("bio","Tekst","Text", KIT.bio_nl);
    push("site","Website","Website", KIT.site);
    push("mail","E-mailadres","Email address", KIT.igMail, true);
  } else if (c.id === "li"){
    push("name","Naam","Name", KIT.org);
    push("site","Website","Website", KIT.site);
    push("bio","Tekst","Text", KIT.bio_nl);
  } else if (c.id === "yt"){
    push("name","Naam","Name", KIT.org);
    push("handle","Adresnaam","Handle", "@"+KIT.handle);
    push("mgr","Beheerder","Manager", KIT.vomMail, true);
  } else if (c.id === "x"){
    push("user","Gebruikersnaam","Username", "@"+KIT.handle);
    push("name","Naam","Name", KIT.org);
    push("bio","Tekst","Text", KIT.bio_nl);
    push("mail","E-mailadres","Email address", KIT.xMail, true);
  } else if (c.id === "email"){
    push("name","Afzendernaam","Sender name", KIT.org);
    push("from","Afzenderadres","Sender address", KIT.emailFrom);
    push("svc","Verzendt via","Sends via", "Vision Outreach Media", true);
  }
  return f;
}
function channelUrl(c){
  switch(c.id){
    case "gbp": return "https://www.google.com/maps/search/" + encodeURIComponent(KIT.org);
    case "fb":  return "https://www.facebook.com/" + KIT.handle;
    case "ig":  return "https://www.instagram.com/" + KIT.handle;
    case "li":  return "https://www.linkedin.com/company/" + KIT.handle;
    case "yt":  return "https://www.youtube.com/@" + KIT.handle;
    case "x":   return "https://x.com/" + KIT.handle;
  }

/* ---- State ---- */
const S_KEY = "vom-channel-wizards-v1";
let state = { lang:"nl", privacyOk:false, route:{view:"privacy"}, ch:{} };
try { const s = JSON.parse(localStorage.getItem(S_KEY)); if (s && s.ch) state = s; } catch(e){}
CHANNELS.forEach(c => {
  if (!state.ch[c.id]) state.ch[c.id] = { branch:null, step:0, done:false };
  if (!state.ch[c.id].details) state.ch[c.id].details = {};
});
let editKey = null, flashKey = null;
if (state.privacyOk && state.route.view === "privacy") state.route = {view:"home"};

function save(){ localStorage.setItem(S_KEY, JSON.stringify(state)); }
function t(o){ return typeof o === "string" ? o : (o[state.lang] || o.nl); }
function ui(k){ return t(UI[k]); }

function setLang(l){
  state.lang = l; save();
  document.getElementById("lang-nl").setAttribute("aria-pressed", String(l==="nl"));
  document.getElementById("lang-en").setAttribute("aria-pressed", String(l==="en"));
  render();
}

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function copyVal(btn, val){
  const done = () => { const old = btn.textContent; btn.textContent = ui("copied"); setTimeout(()=>{ btn.textContent = old; }, 1600); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(val).then(done, done);
  else done();
}

/* ---- Views ---- */
function vPrivacy(){
  return `<div class="card">
    <div class="eyebrow">${esc(ui("org"))}</div>
    <h1>${esc(ui("privacyTitle"))}</h1>
    <p class="muted">${esc(ui("privacyIntro"))}</p>
    <ul class="privacy">
      ${["priv1","priv2","priv3","priv4"].map(k=>`<li><span class="mark">✓</span><span>${esc(ui(k))}</span></li>`).join("")}
    </ul>
  </div>
  <button class="btn primary" onclick="ackPrivacy()">${esc(ui("privacyOk"))}</button>`;
}
function ackPrivacy(){ state.privacyOk = true; state.route = {view:"home"}; save(); render(); }

function chanState(c){
  const st = state.ch[c.id];
  if (st.done) return `<span class="state done">${esc(ui("done"))}</span>`;
  if (st.branch === null && st.step === 0) return `<span class="state">${esc(ui("notStarted"))}</span>`;
  const steps = st.branch === null ? 1 : (st.branch === "yes" ? c.yes.length : c.no.length);
  const cur = st.branch === null ? 1 : Math.min(st.step + 1, steps);
  return `<span class="state">${esc(ui("stepOf"))} ${cur} ${esc(ui("of"))} ${steps}</span>`;
}

function vHome(){
  const allDone = CHANNELS.every(c => state.ch[c.id].done);
  return `<div class="card">
    <h1>${esc(allDone ? ui("allDone") : ui("homeTitle"))}</h1>
    <p class="muted">${esc(allDone ? ui("allDoneBody") : ui("homeIntro"))}</p>
  </div>
  <div class="chanlist">
    ${CHANNELS.map(c=>`
      <button class="chan" onclick="openChan('${c.id}')">
        <span class="badge">${esc(c.badge)}</span>
        <span class="meta"><span class="name">${esc(t(c.name))}</span><br>${chanState(c)}</span>
        <span class="arrow">›</span>
      </button>`).join("")}
    ${UPCOMING.map(u=>`
      <div class="chan upcoming" aria-disabled="true">
        <span class="badge">${esc(u.badge)}</span>
        <span class="meta"><span class="name">${esc(t(u.name))}</span><br><span class="state">${esc(ui("soonState"))}</span></span>
        <span class="soon">${esc(ui("soon"))}</span>
      </div>`).join("")}
  </div>`;
}
function openChan(id){ state.route = {view:"chan", id}; editKey = null; flashKey = null; save(); render(); }

function vChan(){
  const c = CHANNELS.find(x=>x.id===state.route.id);
  const st = state.ch[c.id];
  const head = `<div class="backrow"><button class="btn link" onclick="goHome()">${esc(ui("toHome"))}</button></div>`;

  if (st.done) return head + (state.route.sub === "finish" ? vFinish(c) : vDetail(c));

  if (st.branch === null){
    return `${head}<div class="card">
      <div class="eyebrow">${esc(t(c.name))}</div>
      <h2>${esc(t(c.branch))}</h2>
      <p class="muted small">${esc(ui("branchHint"))}</p>
    </div>
    <button class="btn secondary" onclick="setBranch('${c.id}','yes')">${esc(ui("branchYes"))}</button>
    <button class="btn primary" onclick="setBranch('${c.id}','no')">${esc(ui("branchNo"))}</button>`;
  }

  const steps = st.branch === "yes" ? c.yes : c.no;
  const i = Math.min(st.step, steps.length - 1);
  const s = steps[i];
  const chips = (s.chips||[]).map(ch=>{
    const lab = esc(t(ch[0])), val = ch[1];
    return `<div class="chip"><span class="val"><span class="lab">${lab}</span><span class="tx">${esc(val)}</span></span>
      <button onclick="copyVal(this, ${JSON.stringify(val).replace(/"/g,"&quot;")})">${esc(ui("copy"))}</button></div>`;
  }).join("");
  const link = s.link ? `<a class="btn secondary" href="${esc(s.link[1])}" target="_blank" rel="noopener">${esc(t(s.link[0]))} ↗</a>` : "";
  const note = s.note ? `<div class="note"><b>⚠</b> ${esc(t(s.note))}</div>` : "";
  const wait = s.wait ? `<div class="wait"><span>\u{1F4EC}</span><span>${esc(t(s.wait))}</span></div>` : "";

  return `${head}
  <div class="progress" aria-label="${esc(ui("stepOf"))} ${i+1} ${esc(ui("of"))} ${steps.length}">
    ${steps.map((_,k)=>`<span class="${k<=i?"on":""}"></span>`).join("")}
  </div>
  <div class="card">
    <div class="eyebrow">${esc(t(c.name))} · ${esc(ui("stepOf"))} ${i+1} ${esc(ui("of"))} ${steps.length}</div>
    <h2>${esc(t(s.t))}</h2>
    ${s.b ? `<p>${esc(t(s.b))}</p>` : ""}
    ${chips ? `<div class="chips">${chips}</div>` : ""}
    ${link}${wait}${note}
  </div>
  ${i>0 ? `<button class="btn link" onclick="stepBack('${c.id}')">${esc(ui("back"))}</button>` : ""}
  <button class="btn primary" onclick="stepNext('${c.id}', ${steps.length})">${esc(i === steps.length-1 ? ui("done") : ui("next"))}</button>`;
}

function vFinish(c){
  const nxt = CHANNELS.find(x => !state.ch[x.id].done);
  return `<div class="card center">
    <div class="donebig">✓</div>
    <h2>${esc(ui("finishTitle"))}</h2>
    <p class="muted">${esc(ui("finishBody"))}</p>
  </div>
  <button class="btn primary" onclick="showDetail('${c.id}')">${esc(ui("viewDetails"))}</button>
  ${nxt ? `<button class="btn secondary" onclick="openChan('${nxt.id}')">${esc(ui("nextChannel"))}</button>` : `<button class="btn secondary" onclick="goHome()">${esc(ui("toHome").replace("‹ ",""))}</button>`}`;
}

function vDetail(c){
  const st = state.ch[c.id];
  const when = st.doneAt ? new Date(st.doneAt).toLocaleDateString(state.lang === "nl" ? "nl-NL" : "en-GB") : "";
  const rows = detailFields(c).map(f => {
    const val = st.details[f.k] !== undefined ? st.details[f.k] : f.val;
    if (editKey === f.k){
      return `<div class="drow editing">
        <span class="val"><span class="lab">${esc(t(f.lab))}</span></span>
        <input id="editInput" type="text" value="${esc(val)}" aria-label="${esc(t(f.lab))}">
        <div class="editrow">
          <button class="btn secondary" onclick="cancelEdit()">${esc(ui("cancelBtn"))}</button>
          <button class="btn primary" onclick="saveEdit('${c.id}','${f.k}')">${esc(ui("saveBtn"))}</button>
        </div>
      </div>`;
    }
    return `<div class="drow">
      <span class="val"><span class="lab">${esc(t(f.lab))}</span><span class="tx">${esc(val)}</span></span>
      ${f.fixed
        ? `<span class="fixed">${esc(ui("fixedTag"))}</span>`
        : `<button onclick="startEdit('${f.k}')">${esc(ui("edit"))}</button>`}
    </div>${flashKey === f.k ? `<div class="flash">${esc(ui("editedNote"))}</div>` : ""}`;
  }).join("");
  return `<div class="card">
    <div class="eyebrow">${esc(t(c.name))} · ${esc(ui("detailsEyebrow"))}</div>
    <div class="statusline">
      <span class="dot">✓</span>
      <span class="st">${esc(st.branch === "yes" ? ui("pathExisting") : ui("pathCreated"))}${when ? " · " + esc(ui("readyOn")) + " " + esc(when) : ""}</span>
    </div>
    <p class="muted small">${esc(ui("editHint"))}</p>
    <div class="detail">${rows}</div>
  </div>
  ${channelUrl(c) ? `<a class="btn secondary" href="${esc(channelUrl(c))}" target="_blank" rel="noopener">${esc(ui("openChannel"))} ↗</a>` : ""}
  <button class="btn link" onclick="redoChan('${c.id}')">${esc(ui("redo"))}</button>`;
}

function showDetail(id){ state.route = {view:"chan", id}; editKey = null; save(); render(); }
function startEdit(k){ editKey = k; flashKey = null; render();
  const el = document.getElementById("editInput"); if (el){ el.focus(); el.select && el.select(); } }
function cancelEdit(){ editKey = null; render(); }
function saveEdit(id, k){
  const el = document.getElementById("editInput");
  if (el){ state.ch[id].details[k] = el.value.trim(); }
  editKey = null; flashKey = k; save(); render();
}
function redoChan(id){
  if (!confirm(ui("redoConfirm"))) return;
  state.ch[id] = { branch:null, step:0, done:false, details:{} };
  editKey = null; flashKey = null; save(); render();
}

function setBranch(id, b){ state.ch[id].branch = b; state.ch[id].step = 0; save(); render(); }
function stepBack(id){ const st = state.ch[id]; if (st.step > 0) st.step--; else st.branch = null; save(); render(); }
function stepNext(id, len){
  const st = state.ch[id];
  if (st.step >= len - 1){ st.done = true; st.doneAt = Date.now(); state.route.sub = "finish"; }
  else { st.step++; }
  save(); render();
}
function goHome(){ state.route = {view:"home"}; save(); render(); }

function render(){
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = ui(el.getAttribute("data-i18n")); });
  document.getElementById("demoNote").textContent = ui("demo");
  const v = state.route.view;
  document.getElementById("view").innerHTML =
    v === "privacy" ? vPrivacy() : v === "chan" ? vChan() : vHome();
  window.scrollTo(0,0);
}
document.getElementById("lang-nl").setAttribute("aria-pressed", String(state.lang==="nl"));
document.getElementById("lang-en").setAttribute("aria-pressed", String(state.lang==="en"));
render();
</script>
