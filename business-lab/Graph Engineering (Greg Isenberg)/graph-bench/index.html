<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Graph Bench — implementation wizard</title>
<meta name="description" content="Turn one AI workflow into a managed graph.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#E7E9E2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E120F" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%230E120F'/%3E%3C/svg%3E">
</head>
<body>
<style>
html{font-size:17px}
:root[data-fs="l"]{font-size:19px}
:root[data-fs="xl"]{font-size:21px}

:root{
  --vellum:#E7E9E2; --sheet:#F3F4ED; --sheet-2:#EBEDE4; --sheet-3:#E1E4DA;
  --ink:#141A17; --ink-soft:#4E574F; --ink-faint:#88907F;
  --line:#CBD1C4; --line-soft:#DDE1D5;
  --accent:#0E6B63; --accent-wash:#D8E6E2; --accent-ink:#FFFFFF;
  --check:#A93A24; --check-wash:#F0DFD9;
  --gate:#8A6006;  --gate-wash:#EFE4CC;
  --grid:rgba(20,26,23,.05);
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --shadow:0 1px 2px rgba(20,26,23,.05), 0 10px 28px rgba(20,26,23,.07);
}
@media (prefers-color-scheme:dark){
  :root{
    --vellum:#0E120F; --sheet:#161B17; --sheet-2:#1C221D; --sheet-3:#232A24;
    --ink:#E9EDE4; --ink-soft:#A2AC9F; --ink-faint:#6E7869;
    --line:#2C332C; --line-soft:#232A24;
    --accent:#48C3B2; --accent-wash:#152B28; --accent-ink:#07120F;
    --check:#EE7C5E; --check-wash:#2C1913;
    --gate:#DCA93F;  --gate-wash:#2A2110;
    --grid:rgba(233,237,228,.045);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.4);
  }
}
:root[data-theme="light"]{
  --vellum:#E7E9E2; --sheet:#F3F4ED; --sheet-2:#EBEDE4; --sheet-3:#E1E4DA;
  --ink:#141A17; --ink-soft:#4E574F; --ink-faint:#88907F;
  --line:#CBD1C4; --line-soft:#DDE1D5;
  --accent:#0E6B63; --accent-wash:#D8E6E2; --accent-ink:#FFFFFF;
  --check:#A93A24; --check-wash:#F0DFD9;
  --gate:#8A6006;  --gate-wash:#EFE4CC;
  --grid:rgba(20,26,23,.05);
  --shadow:0 1px 2px rgba(20,26,23,.05), 0 10px 28px rgba(20,26,23,.07);
}
:root[data-theme="dark"]{
  --vellum:#0E120F; --sheet:#161B17; --sheet-2:#1C221D; --sheet-3:#232A24;
  --ink:#E9EDE4; --ink-soft:#A2AC9F; --ink-faint:#6E7869;
  --line:#2C332C; --line-soft:#232A24;
  --accent:#48C3B2; --accent-wash:#152B28; --accent-ink:#07120F;
  --check:#EE7C5E; --check-wash:#2C1913;
  --gate:#DCA93F;  --gate-wash:#2A2110;
  --grid:rgba(233,237,228,.045);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.4);
}

*{box-sizing:border-box}
body{
  margin:0; color:var(--ink); background:var(--vellum);
  background-image:
    repeating-linear-gradient(0deg,var(--grid) 0 1px,transparent 1px 28px),
    repeating-linear-gradient(90deg,var(--grid) 0 1px,transparent 1px 28px);
  font-family:var(--sans); line-height:1.55; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ============ chrome ============ */
.bar{
  position:sticky; top:0; z-index:60; background:color-mix(in srgb,var(--vellum) 90%,transparent);
  backdrop-filter:saturate(1.3) blur(10px); border-bottom:1px solid var(--line);
}
.bar-in{max-width:1400px; margin:0 auto; padding:0 clamp(12px,2.5vw,24px); height:56px; display:flex; align-items:center; gap:14px}
.brand{display:flex; align-items:center; gap:9px; font-family:var(--mono); font-size:0.8125rem; letter-spacing:.17em; text-transform:uppercase; white-space:nowrap}
.brand i{width:7px;height:7px;background:var(--accent);border-radius:50%;flex:none}
.brand span{color:var(--ink-faint)}
.bar .grow{flex:1; min-width:0}
.gname{
  font-family:var(--mono); font-size:0.875rem; letter-spacing:.02em; background:transparent;
  border:1px solid transparent; border-radius:2px; padding:5px 8px; width:100%; max-width:340px;
}
.gname:hover{border-color:var(--line)}
.gname:focus{border-color:var(--accent); background:var(--sheet)}
.prog{display:flex; align-items:center; gap:9px; font-family:var(--mono); font-size:0.84375rem; letter-spacing:.1em; color:var(--ink-faint); white-space:nowrap}
.track{width:96px;height:5px;background:var(--sheet-3);border-radius:99px;overflow:hidden}
.fill{height:100%;width:0;background:var(--accent);transition:width .45s cubic-bezier(.2,.7,.2,1)}
.btn{
  font-family:var(--mono); font-size:0.84375rem; letter-spacing:.12em; text-transform:uppercase;
  background:transparent; border:1px solid var(--line); color:var(--ink-soft);
  padding:8px 12px; border-radius:2px; cursor:pointer; transition:.15s; white-space:nowrap;
}
.btn:hover{color:var(--ink); border-color:var(--accent)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent; color:var(--ink-faint)}
.btn.ghost:hover{color:var(--ink); border-color:var(--line)}
.btn[disabled]{opacity:.35; cursor:not-allowed}
.btn.sm{padding:5px 9px; font-size:0.75rem}
.hide-sm{display:none}
@media(min-width:900px){ .hide-sm{display:inline-flex} }

/* ============ layout ============ */
.stage{max-width:1400px; margin:0 auto; padding:clamp(16px,3vw,32px) clamp(12px,2.5vw,24px) 80px; display:grid; gap:20px}
@media(min-width:1040px){ .stage{grid-template-columns:minmax(0,1fr) minmax(400px,42%)} }

.panel{background:var(--sheet); border:1px solid var(--line); border-radius:3px; box-shadow:var(--shadow); overflow:hidden}
.panel-head{padding:16px 20px; border-bottom:1px solid var(--line-soft); background:var(--sheet-2); display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
.panel-head .sno{font-family:var(--mono); font-size:0.84375rem; letter-spacing:.14em; color:var(--accent)}
.panel-head h2{font-family:var(--mono); font-size:1.03125rem; letter-spacing:.01em; text-transform:uppercase; margin:0; font-weight:600}
.panel-head .hint{margin-left:auto; font-family:var(--mono); font-size:0.8125rem; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint)}
.panel-body{padding:clamp(16px,2.6vw,24px); display:flex; flex-direction:column; gap:18px}
.lede{font-family:var(--serif); font-size:1.125rem; color:var(--ink-soft); margin:0; max-width:62ch}
.lede strong{color:var(--ink); font-weight:600}

/* steps rail */
.rail{display:flex; gap:4px; overflow-x:auto; padding:10px clamp(12px,2.5vw,24px); border-bottom:1px solid var(--line); background:color-mix(in srgb,var(--vellum) 70%,transparent); position:sticky; top:56px; z-index:50; scrollbar-width:thin}
.rail button{
  font-family:var(--mono); font-size:0.8125rem; letter-spacing:.09em; text-transform:uppercase;
  background:transparent; border:1px solid transparent; color:var(--ink-faint);
  padding:6px 10px; border-radius:2px; cursor:pointer; white-space:nowrap; transition:.15s;
}
.rail button:hover{color:var(--ink)}
.rail button[aria-current="true"]{color:var(--accent-ink); background:var(--accent); border-color:var(--accent)}
.rail button.done{color:var(--accent)}
.rail button.done::before{content:"✓ "}

/* fields */
label.f{display:flex; flex-direction:column; gap:7px}
.f .k{font-family:var(--mono); font-size:0.84375rem; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-faint)}
.f .k b{color:var(--check); font-weight:400}
input.t,textarea.t,select.t{
  background:var(--vellum); border:1px solid var(--line); border-radius:2px; padding:11px 12px;
  font-size:1.03125rem; width:100%; transition:.15s;
}
input.t:focus,textarea.t:focus,select.t:focus{border-color:var(--accent); background:var(--sheet)}
textarea.t{resize:vertical; min-height:76px; line-height:1.5}
.helper{font-size:0.96875rem; color:var(--ink-faint); font-family:var(--sans)}

/* chips */
.chips{display:flex; flex-wrap:wrap; gap:7px}
.chip{
  font-family:var(--mono); font-size:0.84375rem; letter-spacing:.08em; text-transform:uppercase;
  background:var(--vellum); border:1px solid var(--line); color:var(--ink-soft);
  padding:8px 11px; border-radius:2px; cursor:pointer; transition:.15s;
}
.chip:hover{border-color:var(--accent); color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}

/* toggles */
.toggles{display:grid; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:3px; overflow:hidden}
.tg{display:flex; gap:13px; align-items:flex-start; padding:15px 16px; background:var(--sheet); cursor:pointer; transition:.15s}
.tg:hover{background:var(--sheet-2)}
.tg input{margin:3px 0 0; accent-color:var(--accent); width:16px; height:16px; flex:none}
.tg .tt{font-family:var(--mono); font-size:0.875rem; letter-spacing:.04em; text-transform:uppercase; display:block; margin-bottom:3px}
.tg .td{font-size:1rem; color:var(--ink-faint); display:block}
.tg:has(input:checked) .tt{color:var(--accent)}

/* job editor */
.jobs{display:flex; flex-direction:column; gap:10px}
.job{border:1px solid var(--line); border-radius:3px; background:var(--vellum); overflow:hidden}
.job-top{display:flex; align-items:center; gap:8px; padding:9px 10px; background:var(--sheet-2); border-bottom:1px solid var(--line-soft)}
.job-top .idx{font-family:var(--mono); font-size:0.8125rem; color:var(--ink-faint); width:20px; flex:none}
.job-top input.name{flex:1; min-width:0; background:transparent; border:1px solid transparent; border-radius:2px; padding:5px 7px; font-family:var(--mono); font-size:0.9375rem; letter-spacing:.03em}
.job-top input.name:hover{border-color:var(--line)}
.job-top input.name:focus{border-color:var(--accent); background:var(--sheet)}
.job-body{padding:11px 12px; display:grid; gap:9px}
@media(min-width:620px){ .job-body{grid-template-columns:1fr 190px} .job-body .full{grid-column:1/-1} }
.job-body input.t,.job-body select.t{padding:8px 10px; font-size:1rem; background:var(--sheet)}
.role-tag{font-family:var(--mono); font-size:0.75rem; letter-spacing:.11em; text-transform:uppercase; padding:4px 7px; border-radius:2px; border:1px solid; flex:none}
.r-plan,.r-merge{color:var(--accent); border-color:var(--accent); background:var(--accent-wash)}
.r-work{color:var(--ink-soft); border-color:var(--line); background:var(--sheet-3)}
.r-check{color:var(--check); border-color:var(--check); background:var(--check-wash)}
.r-gate{color:var(--gate); border-color:var(--gate); background:var(--gate-wash)}
.iconbtn{background:transparent; border:1px solid transparent; color:var(--ink-faint); cursor:pointer; padding:4px 7px; border-radius:2px; font-family:var(--mono); font-size:0.875rem; line-height:1}
.iconbtn:hover{color:var(--ink); border-color:var(--line)}
.iconbtn.del:hover{color:var(--check); border-color:var(--check)}

/* deps */
.deprow{border:1px solid var(--line); border-radius:3px; background:var(--vellum); padding:12px 13px; display:flex; flex-direction:column; gap:9px}
.deprow .dh{display:flex; align-items:center; gap:9px; flex-wrap:wrap}
.deprow .dh .nm{font-family:var(--mono); font-size:0.9375rem; letter-spacing:.03em}
.deprow .dh .tier{margin-left:auto; font-family:var(--mono); font-size:0.75rem; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint)}

/* notes */
.note{border-left:3px solid var(--accent); background:var(--accent-wash); padding:13px 15px; border-radius:0 3px 3px 0; font-size:1rem; color:var(--ink)}
.note.warn{border-left-color:var(--check); background:var(--check-wash)}
.note.gatey{border-left-color:var(--gate); background:var(--gate-wash)}
.note b{font-family:var(--mono); font-size:0.84375rem; letter-spacing:.12em; text-transform:uppercase; display:block; margin-bottom:5px}

/* nav */
.nav{display:flex; gap:10px; align-items:center; padding:16px 20px; border-top:1px solid var(--line-soft); background:var(--sheet-2)}
.nav .sp{flex:1}

/* ============ canvas pane ============ */
.side{display:flex; flex-direction:column; gap:16px; position:relative}
@media(min-width:1040px){ .side{position:sticky; top:118px; align-self:start; max-height:calc(100vh - 138px); overflow-y:auto; scrollbar-width:thin} }
.canvas-wrap{background:var(--sheet); border:1px solid var(--line); border-radius:3px; box-shadow:var(--shadow); overflow:hidden}
.canvas-head{padding:11px 15px; border-bottom:1px solid var(--line-soft); background:var(--sheet-2); display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.canvas-head .t{font-family:var(--mono); font-size:0.84375rem; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-faint)}
.canvas-head .stat{margin-left:auto; font-family:var(--mono); font-size:0.8125rem; letter-spacing:.08em; color:var(--accent); font-variant-numeric:tabular-nums}
.canvas-body{padding:16px; overflow:auto; min-height:220px; max-height:min(58vh,540px);
  background-image:
    repeating-linear-gradient(0deg,var(--grid) 0 1px,transparent 1px 22px),
    repeating-linear-gradient(90deg,var(--grid) 0 1px,transparent 1px 22px);
}
.canvas-body svg{display:block; margin:0 auto}
.empty{font-family:var(--mono); font-size:0.8125rem; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint); text-align:center; padding:52px 20px}
.gnode-lab{font-family:var(--mono); font-size:0.84375rem; letter-spacing:.02em; fill:var(--ink)}
.gnode-sub{font-family:var(--mono); font-size:0.6875rem; letter-spacing:.05em; fill:var(--ink-faint)}
.gedge{stroke:var(--ink-faint); stroke-width:1.2; fill:none}
.tierlab{font-family:var(--mono); font-size:0.6875rem; letter-spacing:.13em; fill:var(--ink-faint)}

/* diagnostics */
.diag{background:var(--sheet); border:1px solid var(--line); border-radius:3px; overflow:hidden}
.diag h3{margin:0; padding:11px 15px; border-bottom:1px solid var(--line-soft); background:var(--sheet-2); font-family:var(--mono); font-size:0.84375rem; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-faint); font-weight:400}
.diag ul{list-style:none; margin:0; padding:0}
.diag li{padding:11px 15px; border-bottom:1px solid var(--line-soft); font-size:1rem; display:flex; gap:10px; align-items:flex-start}
.diag li:last-child{border-bottom:0}
.diag li .m{font-family:var(--mono); font-size:0.75rem; letter-spacing:.1em; text-transform:uppercase; flex:none; padding-top:2px; width:52px}
.ok .m{color:var(--accent)} .bad .m{color:var(--check)} .warnl .m{color:var(--gate)}

/* ============ output ============ */
.out{display:flex; flex-direction:column; gap:16px}
.outblock{border:1px solid var(--line); border-radius:3px; background:var(--vellum); overflow:hidden}
.outblock header{display:flex; align-items:center; gap:10px; padding:10px 13px; background:var(--sheet-2); border-bottom:1px solid var(--line-soft)}
.outblock header .t{font-family:var(--mono); font-size:0.84375rem; letter-spacing:.12em; text-transform:uppercase}
.outblock header .s{font-family:var(--mono); font-size:0.75rem; letter-spacing:.08em; color:var(--ink-faint)}
.outblock header .sp{flex:1}
pre{margin:0; padding:14px; overflow-x:auto; font-family:var(--mono); font-size:0.84375rem; line-height:1.65; color:var(--ink-soft); white-space:pre-wrap; word-break:break-word; max-height:340px; overflow-y:auto}
.tiers{display:flex; flex-direction:column; gap:9px}
.tier{border:1px solid var(--line); border-radius:3px; background:var(--vellum); padding:12px 13px}
.tier .th{font-family:var(--mono); font-size:0.75rem; letter-spacing:.13em; text-transform:uppercase; color:var(--accent); margin-bottom:8px}
.tier .tl{display:flex; flex-wrap:wrap; gap:6px}
.tier .tl span{font-family:var(--mono); font-size:0.8125rem; padding:5px 9px; border:1px solid var(--line); border-radius:2px; background:var(--sheet)}

/* library drawer */
.drawer{position:fixed; inset:0; z-index:80; display:none}
.drawer[data-open="1"]{display:block}
.drawer .scrim{position:absolute; inset:0; background:rgba(10,14,11,.5)}
.drawer .box{
  position:absolute; right:0; top:0; bottom:0; width:min(420px,92vw); background:var(--sheet);
  border-left:1px solid var(--line); display:flex; flex-direction:column; box-shadow:var(--shadow);
}
.drawer .box > header{padding:16px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px}
.drawer .box > header h3{margin:0; font-family:var(--mono); font-size:0.875rem; letter-spacing:.13em; text-transform:uppercase; font-weight:600}
.drawer .box .content{flex:1; overflow-y:auto; padding:16px 18px; display:flex; flex-direction:column; gap:14px}
.glist{display:flex; flex-direction:column; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:3px; overflow:hidden}
.gitem{background:var(--vellum); padding:12px 13px; display:flex; align-items:center; gap:10px}
.gitem .info{flex:1; min-width:0}
.gitem .n{font-family:var(--mono); font-size:0.875rem; letter-spacing:.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.gitem .d{font-family:var(--mono); font-size:0.75rem; letter-spacing:.06em; color:var(--ink-faint); margin-top:3px}
.gitem[data-active="1"]{background:var(--accent-wash)}
.gitem[data-active="1"] .n{color:var(--accent)}

.toast{
  position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(14px); z-index:99;
  background:var(--ink); color:var(--vellum); font-family:var(--mono); font-size:0.8125rem; letter-spacing:.09em;
  text-transform:uppercase; padding:11px 17px; border-radius:2px; opacity:0; pointer-events:none; transition:.24s;
}
.toast[data-on="1"]{opacity:1; transform:translateX(-50%) translateY(0)}

@media (prefers-reduced-motion:reduce){ *{transition:none !important; animation:none !important} }
@media print{ .bar,.rail,.nav,.drawer,.side{display:none} body{background:#fff;background-image:none} }
</style>

<div class="bar">
  <div class="bar-in">
    <div class="brand"><i></i>Graph Bench<span class="hide-sm">/ implementation wizard</span></div>
    <div class="grow"><input class="gname" id="gname" aria-label="Graph name" placeholder="Untitled graph"></div>
    <div class="prog"><span id="progtxt">0 / 10</span><span class="track"><span class="fill" id="progfill"></span></span></div>
    <button class="btn" id="openlib" type="button">Graphs</button>
    <button class="btn ghost" id="themebtn" type="button">Theme</button>
  </div>
</div>

<div class="rail" id="rail"></div>

<div class="stage">
  <div>
    <div class="panel">
      <div class="panel-head">
        <span class="sno" id="stepno">01</span>
        <h2 id="steptitle">The work</h2>
        <span class="hint" id="stephint"></span>
      </div>
      <div class="panel-body" id="stepbody"></div>
      <div class="nav">
        <button class="btn" id="prev" type="button">← Back</button>
        <span class="sp"></span>
        <button class="btn ghost sm" id="resetbtn" type="button">Clear graph</button>
        <button class="btn primary" id="next" type="button">Next →</button>
      </div>
    </div>
  </div>

  <aside class="side">
    <div class="canvas-wrap">
      <div class="canvas-head">
        <span class="t">Live graph</span>
        <span class="stat" id="cstat">—</span>
      </div>
      <div class="canvas-body" id="canvas"><div class="empty">Add jobs and the graph draws itself</div></div>
    </div>
    <div class="diag">
      <h3>The five tests</h3>
      <ul id="diaglist"></ul>
    </div>
  </aside>
</div>

<div class="drawer" id="drawer" aria-hidden="true">
  <div class="scrim" data-close="1"></div>
  <div class="box" role="dialog" aria-label="Graph library">
    <header>
      <h3>Your graphs</h3>
      <span style="flex:1"></span>
      <button class="btn ghost sm" data-close="1" type="button">Close</button>
    </header>
    <div class="content">
      <div class="glist" id="glist"></div>
      <div style="display:flex; gap:8px; flex-wrap:wrap">
        <button class="btn" id="newg" type="button">+ New graph</button>
        <button class="btn" id="dupg" type="button">Duplicate current</button>
      </div>
      <hr style="border:0;border-top:1px solid var(--line);margin:2px 0">
      <div class="f">
        <span class="k">Import — paste a graph file</span>
        <textarea class="t" id="importbox" placeholder='{"name":"…","jobs":[…]}' style="min-height:96px;font-family:var(--mono);font-size:0.84375rem"></textarea>
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap">

/* ============================================================
   3. Graph maths
   ============================================================ */

function byId(id){ for(var i=0;i<G.jobs.length;i++) if(G.jobs[i].id===id) return G.jobs[i]; return null; }

// Longest-path tiers. Nodes in a cycle land in `stranded`.
function computeTiers(){
  var jobs = G.jobs, indeg = {}, tier = {}, adj = {};
  jobs.forEach(function(j){ indeg[j.id]=0; adj[j.id]=[]; });
  jobs.forEach(function(j){
    j.deps.forEach(function(d){
      if(!byId(d)) return;
      indeg[j.id]++; adj[d].push(j.id);
    });
  });
  var q = jobs.filter(function(j){ return indeg[j.id]===0; }).map(function(j){ return j.id; });
  q.forEach(function(id){ tier[id]=0; });
  var seen = 0;
  while(q.length){
    var id = q.shift(); seen++;
    adj[id].forEach(function(n){
      tier[n] = Math.max(tier[n]==null?0:tier[n], tier[id]+1);
      if(--indeg[n]===0) q.push(n);
    });
  }
  var stranded = jobs.filter(function(j){ return tier[j.id]==null; }).map(function(j){ return j.id; });
  var maxT = 0; jobs.forEach(function(j){ if(tier[j.id]!=null && tier[j.id]>maxT) maxT=tier[j.id]; });
  if(stranded.length) stranded.forEach(function(id){ tier[id] = maxT+1; });
  var rows = [];
  jobs.forEach(function(j){
    var t = tier[j.id]||0;
    (rows[t] = rows[t] || []).push(j);
  });
  for(var i=0;i<rows.length;i++) rows[i] = rows[i]||[];
  return {rows:rows, tier:tier, stranded:stranded, cyclic:stranded.length>0};
}

// A dependency is "fake waiting" if it's already reachable through another dep.
function fakeWaits(){
  var out = [];
  var reach = {};
  function reaches(a,b,guard){
    guard = guard||{};
    if(guard[a]) return false; guard[a]=1;
    var j = byId(a); if(!j) return false;
    for(var i=0;i<j.deps.length;i++){
      if(j.deps[i]===b) return true;
      if(reaches(j.deps[i],b,guard)) return true;
    }
    return false;
  }
  G.jobs.forEach(function(j){
    j.deps.forEach(function(d){
      for(var i=0;i<j.deps.length;i++){
        var other = j.deps[i];
        if(other!==d && reaches(other,d)){ out.push({job:j, dep:d, via:other}); break; }
      }
    });
  });
  return out;
}

function diagnostics(){
  var t = computeTiers();
  var parallel = t.rows.filter(function(r){ return r.length>1; }).length;
  var checks = G.jobs.filter(function(j){ return j.role==="check"; });
  var gates  = G.jobs.filter(function(j){ return j.role==="gate"; });
  var fw = fakeWaits();
  var terminal = G.jobs.filter(function(j){
    return !G.jobs.some(function(k){ return k.deps.indexOf(j.id)>=0; });
  });
  var selfGrade = checks.filter(function(c){
    return c.deps.length===0;
  });
  return {
    tiers:t, parallel:parallel, checks:checks, gates:gates, fake:fw,
    terminal:terminal, selfGrade:selfGrade,
    tests:[
      {ok: fw.length===0 && parallel>0, warn: parallel===0,
       label:"Fake waiting",
       good: parallel+" tier"+(parallel===1?"":"s")+" run in parallel, no redundant arrows",
       bad: fw.length ? fw.length+" arrow"+(fw.length===1?"":"s")+" make a job wait for something it already gets" : "Nothing runs in parallel — everything is a straight line"},
      {ok: checks.length>0 && selfGrade.length===0, warn:false,
       label:"Worker ≠ checker",
       good: checks.length+" checker lane"+(checks.length===1?"":"s")+", each reading someone else's work",
       bad: checks.length===0 ? "No checker — the writer is grading its own answer" : "A checker with no inputs is grading itself"},
      {ok: gates.length>0, warn:false,
       label:"Human gate",
       good: "A human signs off at “"+(gates[0]?gates[0].name:"the gate")+"” before anyone acts on this",
       bad: "No human gate — nobody signs off before this matters"},
      {ok: terminal.length===1 && !t.cyclic, warn:false,
       label:"It terminates",
       good: "One clean end: "+(terminal[0]?terminal[0].name:"—"),
       bad: t.cyclic ? "There's a loop — some jobs wait on each other forever"
            : terminal.length===0 ? "No end node" : terminal.length+" jobs end the graph — which one is the answer?"},
      {ok: G.state.picks.length>0 || G.state.custom.trim()!=="", warn:false,
       label:"Leaves state",
       good: (G.state.picks.length + (G.state.custom.trim()?1:0))+" kinds of memory survive the run",
       bad: "Nothing survives this run — no compounding"},
      {ok: G.jobs.length<=9, warn:G.jobs.length>9 && G.jobs.length<=12,
       label:"Smallest graph",
       good: G.jobs.length+" jobs — small enough to hold in your head",
       bad: G.jobs.length+" jobs. More agents often means more noise. Cut until each one earns its place."}
    ]
  };
}

/* ============================================================
   4. Rendering the graph
   ============================================================ */

var NW=148, NH=50, GX=16, GY=54, PAD=14, LABW=30;

function roleColor(role){
  if(role==="check") return {s:"var(--check)", f:"var(--check-wash)", t:"var(--check)"};
  if(role==="gate")  return {s:"var(--gate)",  f:"var(--gate-wash)",  t:"var(--gate)"};
  if(role==="plan"||role==="merge") return {s:"var(--accent)", f:"var(--accent-wash)", t:"var(--accent)"};
  return {s:"var(--line)", f:"var(--sheet-2)", t:"var(--ink)"};
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function trunc(s,n){ s=String(s||""); return s.length>n ? s.slice(0,n-1)+"…" : s; }

function drawGraph(){
  var el = document.getElementById("canvas");
  var stat = document.getElementById("cstat");
  if(!G.jobs.length){ el.innerHTML = '<div class="empty">Add jobs and the graph draws itself</div>'; stat.textContent="—"; return; }

  var d = computeTiers();
  var rows = d.rows;
  var wide = 0;
  rows.forEach(function(r){ wide = Math.max(wide, r.length*NW + (r.length-1)*GX); });
  var W = wide + PAD*2 + LABW;
  var H = rows.length*NH + (rows.length-1)*GY + PAD*2;

  var pos = {};
  rows.forEach(function(row,ti){
    var rowW = row.length*NW + (row.length-1)*GX;
    var x0 = LABW + PAD + (wide-rowW)/2;
    row.forEach(function(j,i){
      pos[j.id] = {x: x0 + i*(NW+GX), y: PAD + ti*(NH+GY), t:ti};
    });
  });

  var svg = ['<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:'+W+'px" role="img" aria-label="The graph you are building">'];

  // edges first
  G.jobs.forEach(function(j){
    var to = pos[j.id]; if(!to) return;
    j.deps.forEach(function(dep){
      var from = pos[dep]; if(!from) return;
      var x1 = from.x + NW/2, y1 = from.y + NH;
      var x2 = to.x + NW/2,   y2 = to.y;
      var my = y1 + (y2-y1)/2;
      var back = y2 <= y1;
      var stroke = back ? "var(--check)" : "var(--ink-faint)";
      var dash = back ? ' stroke-dasharray="3 3"' : '';
      var path = back
        ? "M"+x1+" "+y1+" V"+(y1+14)+" H"+(x2-NW/2-9)+" V"+(y2-14)+" H"+x2+" V"+y2
        : "M"+x1+" "+y1+" V"+my+" H"+x2+" V"+y2;
      svg.push('<path d="'+path+'" fill="none" stroke="'+stroke+'" stroke-width="1.2"'+dash+'/>');
      svg.push('<path d="M'+(x2-4)+' '+(y2-6)+' L'+x2+' '+y2+' L'+(x2+4)+' '+(y2-6)+'" fill="none" stroke="'+stroke+'" stroke-width="1.2"/>');
    });
  });

  // tier labels + nodes
  rows.forEach(function(row,ti){
    if(!row.length) return;
    var y = PAD + ti*(NH+GY);
    svg.push('<text x="4" y="'+(y+16)+'" class="tierlab">T'+ti+'</text>');
    if(row.length>1){
      svg.push('<text x="4" y="'+(y+30)+'" class="tierlab" fill="var(--accent)">‖'+row.length+'</text>');
    }
    row.forEach(function(j){
      var p = pos[j.id], c = roleColor(j.role);
      svg.push('<rect x="'+p.x+'" y="'+p.y+'" width="'+NW+'" height="'+NH+'" rx="2" fill="'+c.f+'" stroke="'+c.s+'" stroke-width="1.25"/>');
      // corner ticks
      svg.push('<path d="M'+p.x+' '+(p.y+7)+' V'+p.y+' H'+(p.x+7)+'" fill="none" stroke="'+c.s+'" stroke-width="1.4"/>');
      svg.push('<path d="M'+(p.x+NW-7)+' '+(p.y+NH)+' H'+(p.x+NW)+' V'+(p.y+NH-7)+'" fill="none" stroke="'+c.s+'" stroke-width="1.4"/>');
      svg.push('<text x="'+(p.x+10)+'" y="'+(p.y+21)+'" class="gnode-lab" fill="'+c.t+'">'+esc(trunc(j.name,20))+'</text>');
      svg.push('<text x="'+(p.x+10)+'" y="'+(p.y+36)+'" class="gnode-sub">'+esc(ROLES[j.role].label.toUpperCase())+(j.file?' · '+esc(trunc(j.file,14)):'')+'</text>');
    });
  });

  svg.push('</svg>');
  el.innerHTML = svg.join("");
  var par = rows.filter(function(r){return r.length>1;}).length;
  stat.textContent = G.jobs.length+" jobs · "+rows.length+" tiers · "+par+" parallel";
}

function drawDiagnostics(){
  var d = diagnostics();
  var ul = document.getElementById("diaglist");
  ul.innerHTML = d.tests.map(function(t){
    var cls = t.ok ? "ok" : (t.warn ? "warnl" : "bad");
    var mark = t.ok ? "PASS" : (t.warn ? "WATCH" : "FIX");
    return '<li class="'+cls+'"><span class="m">'+mark+'</span><span>'+esc(t.ok? t.good : t.bad)+'</span></li>';
  }).join("");
}

/* ---------- the run sheet ---------- */

function lanePrompt(j){
  var deps = j.deps.map(byId).filter(Boolean);
  var siblings = G.jobs.filter(function(k){
    return k.id!==j.id && k.role!=="gate" && sameTier(k,j);
  });
  var L = [];
  L.push("ROLE — " + j.name.toUpperCase());
  L.push("");
  L.push("You are one lane in a graph. The whole graph exists to produce:");
  L.push("  " + (G.outcome || "[the outcome — fill this in]"));
  if(G.decision) L.push("That output feeds this decision: " + G.decision);
  L.push("");
  L.push("YOUR ONE JOB");
  L.push("  " + (j.job || "[what this lane is responsible for]"));
  L.push("");
  L.push("INPUTS");
  if(deps.length) deps.forEach(function(d){ L.push("  - " + (d.file||d.name) + " — from the " + d.name + " lane"); });
  else L.push("  - The question itself. You start from nothing else.");
  L.push("");
  L.push("OUTPUT");
  L.push("  Write " + (j.file||"output.md") + ".");
  if(j.role==="check"){
    L.push("  A list of objections, each naming the claim it attacks and how confident you are.");
  } else if(j.role==="merge"){
    L.push("  The recommendation, the reasoning, and what evidence would change it.");
  } else if(j.role==="plan"){
    L.push("  The angles that would actually change the answer, one per lane.");
  } else {
    L.push("  Findings with sources. Mark each one: solid / thin / assumed.");
  }
  L.push("");
  L.push("CONSTRAINTS");
  L.push("  - Do only your job. Do not do the work of the other lanes" + (siblings.length ? " (" + siblings.map(function(s){return s.name;}).join(", ") + ")" : "") + ".");
  if(j.role==="check"){
    L.push("  - Your job is to KILL weak findings, not to be balanced. \"Looks strong overall\" is a failed review.");
    var t = G.skeptic.targets.map(function(k){
      for(var i=0;i<SKEPTIC_OPTS.length;i++) if(SKEPTIC_OPTS[i][0]===k) return SKEPTIC_OPTS[i][1];
      return null;
    }).filter(Boolean);
    if(t.length){ L.push("  - Attack specifically:"); t.forEach(function(x){ L.push("      · " + x); }); }
    if(G.skeptic.custom.trim()) L.push("      · " + G.skeptic.custom.trim());
    L.push("  - You did not write this work. Do not defend it.");
  } else {
    L.push("  - Do not grade your own work. A separate checker lane does that.");
    L.push("  - Say \"I don't know\" rather than filling a gap with a confident guess.");
    L.push("  - Every claim carries a source and a date, or it is marked as an assumption.");
  }
  L.push("");
  L.push("STOP WHEN");
  L.push("  " + (j.role==="check"
    ? "Every claim in your inputs has been either confirmed, weakened, or killed."
    : j.role==="merge" ? "The recommendation is one page and stands on the surviving evidence only."
    : "Your file answers your one job and nothing more. Do not keep going."));
  return L.join("\n");
}

function sameTier(a,b){
  var t = computeTiers().tier;
  return t[a.id]===t[b.id];
}

function kickoffPrompt(){
  var d = computeTiers();
  var L = [];
  L.push("Run this graph. It's a workflow, not a single task — follow the tiers.");
  L.push("");
  L.push("GOAL: " + (G.outcome || "[outcome]"));
  if(G.decision) L.push("DECISION IT FEEDS: " + G.decision);
  L.push("WORKING DIRECTORY: " + (G.state.custom.trim() || "./" + slug(G.name) + "/"));
  L.push("");
  L.push("THE GRAPH");
  d.rows.forEach(function(row,i){
    if(!row.length) return;
    L.push("  Tier " + i + (row.length>1 ? "  (these run AT THE SAME TIME — use parallel subagents)" : ""));
    row.forEach(function(j){
      var deps = j.deps.map(function(x){ var y=byId(x); return y?(y.file||y.name):x; });
      L.push("    - " + j.name + " [" + ROLES[j.role].label.toLowerCase() + "]");
      L.push("        job:    " + (j.job||"—"));
      L.push("        reads:  " + (deps.length?deps.join(", "):"the question"));
      L.push("        writes: " + (j.file||"output.md"));
    });
  });
  L.push("");
  L.push("RULES");
  L.push("  1. Each job writes its own file. Never merge two jobs into one pass.");
  L.push("  2. Jobs in the same tier have no dependency on each other — run them concurrently.");
  L.push("  3. The checker lane must not be the same pass that produced the work it checks.");
  var gate = G.jobs.filter(function(j){ return j.role==="gate"; })[0];
  if(gate){
    L.push("  4. STOP at \"" + gate.name + "\". Do not " + gateVerb() + ". Present the output and wait for an explicit yes.");
    if(G.gateWho) L.push("     What I'm approving: " + G.gateWho);
  } else {
    L.push("  4. There is no human gate in this graph. Add one before running it on anything that matters.");
  }
  L.push("  5. Leave the state behind: " + (stateList().join(", ") || "at minimum the evidence and the decision") + ".");
  return L.join("\n");
}

function gateVerb(){
  return {memo:"act on it", internal:"circulate it", customer:"send anything",
          public:"publish anything", deploy:"deploy, merge or touch production",
          money:"move any money"}[G.risk] || "act on it";
}
function stateList(){
  return G.state.picks.map(function(k){
    for(var i=0;i<STATE_OPTS.length;i++) if(STATE_OPTS[i][0]===k) return STATE_OPTS[i][1].toLowerCase();
    return null;
  }).filter(Boolean);
}
function slug(s){ return String(s||"graph").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "graph"; }

function markdownBrief(){
  var d = computeTiers(), dg = diagnostics();
  var L = [];
  L.push("# " + G.name);
  L.push("");
  L.push("**Outcome —** " + (G.outcome||"_not set_"));

  L.push("**Gate —** " + RISKS[G.risk].label + " → " + RISKS[G.risk].gate + " gate" + (G.gateWho? " · approving: " + G.gateWho : ""));
  L.push("");
  L.push("## Run order");
  L.push("");
  d.rows.forEach(function(row,i){
    if(!row.length) return;
    L.push("**Tier " + i + "**" + (row.length>1 ? " — run these at the same time" : ""));
    row.forEach(function(j){
      L.push("- `" + (j.file||"output.md") + "` · **" + j.name + "** (" + ROLES[j.role].label.toLowerCase() + ") — " + (j.job||"—"));
    });
    L.push("");
  });
  L.push("## The five tests");
  L.push("");
  dg.tests.forEach(function(t){
    L.push("- " + (t.ok?"**PASS**":"**FIX**") + " · " + t.label + " — " + (t.ok?t.good:t.bad));
  });
  L.push("");
  L.push("## Lane prompts");
  L.push("");
  G.jobs.filter(function(j){ return j.role!=="gate"; }).forEach(function(j){
    L.push("### " + j.name);
    L.push("");
    L.push("```");
    L.push(lanePrompt(j));
    L.push("```");
    L.push("");
  });
  var gate = G.jobs.filter(function(j){ return j.role==="gate"; })[0];
  if(gate){
    L.push("## The gate — " + gate.name);
    L.push("");
    L.push("Before you " + gateVerb() + ", check:");
    L.push("");
    L.push("- [ ] I read the checker's objections, including the ones I'm overruling");
    L.push("- [ ] Every number I'm relying on has a source and a date");
    L.push("- [ ] I can say what evidence would change my mind");
    L.push("- [ ] " + (G.gateWho || "I know exactly what I'm approving"));
    L.push("");
  }
  L.push("## Kickoff prompt");
  L.push("");
  L.push("```");
  L.push(kickoffPrompt());
  L.push("```");
  L.push("");
  L.push("## Three-run log");
  L.push("");
  L.push("Don't automate until this table is full and the graph won each time.");
  L.push("");
  L.push("| Run | Date | Time spent | Better than the old way? | What to cut |");
  L.push("|---|---|---|---|---|");
  L.push("| 1 |  |  |  |  |");
  L.push("| 2 |  |  |  |  |");
  L.push("| 3 |  |  |  |  |");
  L.push("");
  L.push("---");
  L.push("Built with the Graph Bench · method from Greg Isenberg, *Why Graph Engineering will 10x your Claude/Codex* — https://www.youtube.com/watch?v=JWhICz1QR8M");
  return L.join("\n");
}

render.run = function(){
  var d = computeTiers(), dg = diagnostics();
  var fails = dg.tests.filter(function(t){ return !t.ok && !t.warn; });

  var tiers = d.rows.map(function(row,i){
    if(!row.length) return "";
    return '<div class="tier"><div class="th">Tier '+i+(row.length>1?" — at the same time":"")+'</div><div class="tl">'+
      row.map(function(j){ return '<span>'+esc(j.name)+' → '+esc(j.file||"output.md")+'</span>'; }).join("")+'</div></div>';
  }).join("");

  var lanes = G.jobs.filter(function(j){ return j.role!=="gate"; }).map(function(j){
    return '<div class="outblock"><header><span class="t">'+esc(j.name)+'</span><span class="s">'+ROLES[j.role].label+' → '+esc(j.file||"output.md")+'</span><span class="sp"></span>'+
      '<button class="btn ghost sm" data-copy="lane" data-id="'+j.id+'" type="button">Copy</button></header>'+
      '<pre>'+esc(lanePrompt(j))+'</pre></div>';
  }).join("");

  el.body.innerHTML =
    (fails.length ? '<div class="note warn"><b>'+fails.length+' test'+(fails.length===1?"":"s")+' still failing</b>'+
      fails.map(function(t){ return esc(t.label)+" — "+esc(t.bad); }).join("<br>")+
      '<br><br>You can run it anyway. Just know which corner you cut.</div>'
      : '<div class="note"><b>All five tests pass</b>This is a graph worth running.</div>')+
    '<p class="lede">Everything below is generated from your answers. Copy the lane prompts into separate chats for a Level 1 run, or hand the kickoff prompt to Claude Code for Level 2.</p>'+
    '<div class="tiers">'+tiers+'</div>'+
    '<div class="outblock"><header><span class="t">Kickoff prompt</span><span class="s">for Claude Code / Codex</span><span class="sp"></span>'+
      '<button class="btn ghost sm" data-copy="kick" type="button">Copy</button></header><pre>'+esc(kickoffPrompt())+'</pre></div>'+
    '<p class="lede" style="font-size:1.03125rem"><strong>Lane prompts</strong> — one per job. Each one is written so the lane can\'t quietly do another lane\'s work.</p>'+
    '<div class="out">'+lanes+'</div>'+
    '<div class="note gatey"><b>Before you automate</b>Run this manually three times. If the manual version doesn\'t clearly beat your old workflow, automating it just produces mediocre work faster. The exported brief has the log table.</div>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
      '<button class="btn primary" data-copy="md" type="button">Copy full brief</button>'+
      '<button class="btn" id="dlmd" type="button">Download .md</button>'+
      '<button class="btn" id="dljson" type="button">Download graph file</button>'+
      '<button class="btn" id="printit" type="button">Print</button>'+
    '</div>';

  el.body.querySelectorAll("[data-copy]").forEach(function(b){
    b.addEventListener("click", function(){
      var k = b.getAttribute("data-copy");
      var txt = k==="md" ? markdownBrief() : k==="kick" ? kickoffPrompt() : lanePrompt(byId(b.getAttribute("data-id")));
      copy(txt, k==="md" ? "Brief copied" : "Prompt copied");
    });
  });
  document.getElementById("dlmd").onclick = function(){ download(slug(G.name)+"-graph.md", markdownBrief(), "text/markdown"); };
  document.getElementById("dljson").onclick = function(){ download(slug(G.name)+".graph.json", JSON.stringify(G,null,2), "application/json"); };
  document.getElementById("printit").onclick = function(){ window.print(); };
};

/* ============================================================
   6. Shell
   ============================================================ */

function bindInput(id, fn){
  var n = document.getElementById(id);
  if(!n) return;
  n.addEventListener("input", function(){ fn(n.value); commit(false); });
}

function commit(redraw){
  save();
  drawGraph(); drawDiagnostics(); paintRail();
  if(redraw!==false){} // panels re-render themselves where needed
}

function syncName(){
  var n = document.getElementById("gname");
  if(n.value !== G.name) n.value = G.name;
}

function stepComplete(i){
  var s = STEPS[i].id;
  if(s==="work") return !!G.name.trim();
  if(s==="outcome") return !!G.outcome.trim();
  if(s==="qualify") return G.qualify.steps||G.qualify.parallel||G.qualify.checked;
  if(s==="jobs") return G.jobs.length>=2;
  if(s==="arrows") return G.jobs.some(function(j){ return j.deps.length>0; });
  if(s==="skeptic") return G.jobs.some(function(j){ return j.role==="check"; });
  if(s==="gate") return G.jobs.some(function(j){ return j.role==="gate"; });
  if(s==="level") return true;
  if(s==="state") return G.state.picks.length>0 || !!G.state.custom.trim();
  return false;
}

function paintRail(){
  el.rail.innerHTML = STEPS.map(function(s,i){
    return '<button type="button" data-go="'+i+'" class="'+(stepComplete(i)&&i!==G.step?"done":"")+'" aria-current="'+(i===G.step)+'">'+
      String(i+1).padStart(2,"0")+' '+esc(s.title)+'</button>';
  }).join("");
  el.rail.querySelectorAll("[data-go]").forEach(function(b){
    b.addEventListener("click", function(){ go(parseInt(b.getAttribute("data-go"),10)); });
  });
  var done = STEPS.filter(function(_,i){ return stepComplete(i); }).length;
  document.getElementById("progtxt").textContent = done + " / " + STEPS.length;
  document.getElementById("progfill").style.width = (done/STEPS.length*100) + "%";
}

function go(i){
  G.step = Math.max(0, Math.min(STEPS.length-1, i));
  save(); paint();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paint(){
  var s = STEPS[G.step];
  el.no.textContent = String(G.step+1).padStart(2,"0");
  el.title.textContent = s.title;
  el.hint.textContent = s.hint;
  render[s.id]();
  document.getElementById("prev").disabled = G.step===0;
  document.getElementById("next").disabled = G.step===STEPS.length-1;
  document.getElementById("next").textContent = G.step===STEPS.length-2 ? "Build the run sheet →" : "Next →";
  drawGraph(); drawDiagnostics(); paintRail(); syncName();
}

document.getElementById("prev").onclick = function(){ go(G.step-1); };
document.getElementById("next").onclick = function(){ go(G.step+1); };
document.getElementById("resetbtn").onclick = function(){
  if(!confirm("Clear this graph back to an empty one? Your other graphs are untouched.")) return;
  var i = store.graphs.indexOf(G);
  store.graphs[i] = blankGraph("blank"); G = store.graphs[i];
  save(); paint(); toast("Cleared");
};
document.getElementById("gname").addEventListener("input", function(e){
  G.name = e.target.value; save(); paintRail();
});

/* theme */
document.getElementById("themebtn").onclick = function(){
  var r = document.documentElement, cur = r.getAttribute("data-theme");
  if(!cur) cur = matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light";
  r.setAttribute("data-theme", cur==="dark" ? "light" : "dark");
};

/* library */
var drawer = document.getElementById("drawer");
function openDrawer(o){
  drawer.setAttribute("data-open", o?"1":"0");
  drawer.setAttribute("aria-hidden", o?"false":"true");
  if(o) paintLib();
}
document.getElementById("openlib").onclick = function(){ openDrawer(true); };
drawer.addEventListener("click", function(e){ if(e.target.getAttribute("data-close")) openDrawer(false); });

function paintLib(){
  document.getElementById("glist").innerHTML = store.graphs.map(function(g,i){
    var done = 0;
    return '<div class="gitem" data-active="'+(i===store.active?1:0)+'">'+
      '<div class="info"><div class="n">'+esc(g.name||"Untitled")+'</div>'+
      '<div class="d">'+g.jobs.length+' jobs · '+(LEVELS[g.level]||LEVELS["1"]).label.split("—")[0].trim()+'</div></div>'+
      '<button class="btn ghost sm" data-open="'+i+'" type="button">Open</button>'+
      (store.graphs.length>1 ? '<button class="iconbtn del" data-rm="'+i+'" title="Delete" type="button">✕</button>' : '')+
      '</div>';
  }).join("");
  document.querySelectorAll("[data-open]").forEach(function(b){
    b.addEventListener("click", function(){
      store.active = parseInt(b.getAttribute("data-open"),10);
      G = store.graphs[store.active]; save(); paint(); openDrawer(false); toast("Opened");
    });
  });
  document.querySelectorAll("[data-rm]").forEach(function(b){
    b.addEventListener("click", function(){
      var i = parseInt(b.getAttribute("data-rm"),10);
      if(!confirm("Delete “"+(store.graphs[i].name||"Untitled")+"”?")) return;
      store.graphs.splice(i,1);
      store.active = Math.min(store.active, store.graphs.length-1);
      G = store.graphs[store.active]; save(); paint(); paintLib(); toast("Deleted");
    });
  });
}
document.getElementById("newg").onclick = function(){
  store.graphs.push(blankGraph("blank"));
  store.active = store.graphs.length-1; G = store.graphs[store.active];
  save(); paint(); paintLib(); toast("New graph");
};
document.getElementById("dupg").onclick = function(){
  var c = JSON.parse(JSON.stringify(G));
  c.id = uid(); c.name = G.name + " (copy)";
  var map = {};
  c.jobs.forEach(function(j){ var n=uid(); map[j.id]=n; j.id=n; });
  c.jobs.forEach(function(j){ j.deps = j.deps.map(function(d){ return map[d]||d; }); });
  store.graphs.push(c); store.active = store.graphs.length-1; G = c;
  save(); paint(); paintLib(); toast("Duplicated");
};
document.getElementById("doimport").onclick = function(){
  var box = document.getElementById("importbox");
  try{
    var o = JSON.parse(box.value);
    var list = Array.isArray(o) ? o : (o.graphs && Array.isArray(o.graphs) ? o.graphs : [o]);
    var n = 0;
    list.forEach(function(g){
      if(!g || !Array.isArray(g.jobs)) return;
      g.id = uid(); g.step = 0;
      g.qualify = g.qualify||{steps:false,parallel:false,checked:false};
      g.skeptic = g.skeptic||{targets:[],custom:""};
      g.state = g.state||{picks:[],custom:""};
      g.tools = g.tools||[]; g.level = g.level||"1"; g.risk = g.risk||"memo";
      store.graphs.push(g); n++;
    });
    if(!n) throw new Error("no graphs");
    store.active = store.graphs.length-1; G = store.graphs[store.active];
    box.value=""; save(); paint(); paintLib(); toast(n+" imported");
  }catch(e){
    toast("That isn't a graph file");
  }
};
document.getElementById("exportall").onclick = function(){
  download("graph-bench-export.json", JSON.stringify(store, null, 2), "application/json");
};

/* utils */
var toastEl = document.getElementById("toast"), toastT;
function toast(m){
  toastEl.textContent = m; toastEl.setAttribute("data-on","1");
  clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.setAttribute("data-on","0"); }, 1900);
}
function copy(text, msg){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast(msg||"Copied"); }, fallback);
  } else fallback();
  function fallback(){
    var ta=document.createElement("textarea"); ta.value=text;
    ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta);
    ta.select(); try{ document.execCommand("copy"); toast(msg||"Copied"); }catch(e){ toast("Copy failed"); }
    document.body.removeChild(ta);
  }
}
function download(name, text, type){
  var b = new Blob([text], {type:type||"text/plain"});
  var u = URL.createObjectURL(b), a = document.createElement("a");
  a.href=u; a.download=name; document.body.appendChild(a); a.click();
  document.body.removeChild(a); setTimeout(function(){ URL.revokeObjectURL(u); }, 800);
  toast("Downloaded");
}

paint();
})();
</script>

<script>
/* ---------- text size ----------------------------------------------------
   One root font-size knob; every font-size in this file is rem, so the whole
   page scales together. Added 2026-08-06 at the operator's request.
------------------------------------------------------------------------- */
(function(){
  var SIZES = ["m","l","xl"];
  var K = (typeof KEY === "string" ? KEY : location.pathname) + ".fs";
  var host = document.querySelector(".bar-in") || document.querySelector(".topbar .wrap") ||
             document.querySelector(".bar") || document.querySelector("header") || document.body;
  var b = document.createElement("button");
  b.type = "button";
  b.className = "btn ghost sm";
  b.title = "Text size";
  b.setAttribute("aria-label", "Text size");
  /* no margin — the bar is a flex row with its own gap, and at the largest
     text size an extra 8px is what tips it into a horizontal scrollbar */
  b.style.cssText = "flex:none;font-family:var(--mono,monospace);cursor:pointer";
  if(host === document.body){
    b.style.cssText += ";position:fixed;top:10px;right:12px;z-index:999;background:var(--sheet,#fff);border:1px solid var(--line,#ccc);border-radius:2px;padding:6px 10px";
  }
  function apply(v){
    if(v === "m") document.documentElement.removeAttribute("data-fs");
    else document.documentElement.setAttribute("data-fs", v);
    b.textContent = v === "m" ? "A" : (v === "l" ? "A+" : "A++");
  }
  b.addEventListener("click", function(){
    var cur = document.documentElement.getAttribute("data-fs") || "m";
    var next = SIZES[(SIZES.indexOf(cur) + 1) % SIZES.length];
    apply(next);
    try{ localStorage.setItem(K, next); }catch(e){}
  });
  var saved = "m";
  try{ saved = localStorage.getItem(K) || "m"; }catch(e){}
  apply(saved);
  host.appendChild(b);
})();
</script>
