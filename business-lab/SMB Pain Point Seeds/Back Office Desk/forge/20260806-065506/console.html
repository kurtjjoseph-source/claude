<head>
<meta charset="utf-8">

<title>Forge</title>
<style>
  /* VOM Kit v2 — the `.vk-forge` surface. The console is the one place the ground
     legitimately differs from the house paper: it is a tool being watched, not a page
     being read. It still uses the kit's dark tokens, so it belongs to the same family
     as every product site's dark mode rather than being its own private black. */
  :root{
    --base:#0E100F; --base-2:#161A18; --base-3:#1C211E;
    --ink:#F0F2EE; --muted:#A8B1AA; --faint:#79837C; --line:#2A322D;
    --accent:#E8843C; --accent-2:#FDBA74; --on-accent:#0E100F;
    --ok:#38D07F; --warn:#E0A94B; --bad:#E8785C;
    --radius:14px; --radius-sm:9px;
    --font:'Manrope',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --mono:ui-monospace,SFMono-Regular,'SF Mono','Cascadia Code',Menlo,monospace;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--base);color:var(--ink);font-family:var(--font);
       line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1140px;margin:0 auto;padding:0 22px}

  /* ---------- header ---------- */
  header{border-bottom:1px solid var(--line);background:
      radial-gradient(120% 140% at 12% 0%, color-mix(in srgb,var(--accent) 16%,transparent) 0%, transparent 58%),
      var(--base);}
  .top{display:flex;align-items:flex-start;gap:22px;padding:26px 0 22px;flex-wrap:wrap}
  .mark{display:flex;align-items:center;gap:13px}
  .anvil{width:44px;height:44px;border-radius:12px;background:var(--accent);color:var(--on-accent);
    display:grid;place-items:center;font-size:22px;font-weight:800;flex:none;
    box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 45%,transparent),
               0 0 34px color-mix(in srgb,var(--accent) 30%,transparent)}
  body[data-state="running"] .anvil{animation:heat 1.5s ease-in-out infinite}
  @keyframes heat{0%,100%{box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 45%,transparent),0 0 24px color-mix(in srgb,var(--accent) 22%,transparent)}
                  50%{box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 70%,transparent),0 0 50px color-mix(in srgb,var(--accent) 55%,transparent)}}
  h1{margin:0;font-size:1.32rem;font-weight:800;letter-spacing:.02em}
  h1 .sub{display:block;font-size:.86rem;font-weight:600;color:var(--muted);letter-spacing:0}
  .meta{margin-left:auto;display:flex;gap:26px;flex-wrap:wrap;text-align:right}
  .meta div{min-width:88px}
  .meta .k{font-size:.68rem;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .meta .v{font-weight:750;font-size:.98rem;font-variant-numeric:tabular-nums}
  .clock{font-size:1.9rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;
    color:var(--accent);line-height:1.1}

  .bar{height:3px;background:var(--base-3);position:relative;overflow:hidden}
  .bar i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));
    transition:width .5s cubic-bezier(.4,0,.2,1)}
  body[data-state="failed"] .bar i{background:var(--bad)}

  /* ---------- layout ---------- */
  .grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:26px;padding:26px 0 60px}
  @media (max-width:900px){ .grid{grid-template-columns:1fr} }
  .panel{background:var(--base-2);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .panel > h2{margin:0;padding:14px 18px;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);font-weight:750;border-bottom:1px solid var(--line)}

  /* ---------- stage rail ---------- */
  ol.rail{list-style:none;margin:0;padding:8px 0}
  ol.rail li{display:flex;gap:14px;padding:9px 18px;position:relative}
  ol.rail li::before{content:"";position:absolute;left:33px;top:0;bottom:0;width:1px;background:var(--line)}
  ol.rail li:first-child::before{top:22px}
  ol.rail li:last-child::before{bottom:calc(100% - 22px)}
  .cue{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;
    font-size:14px;background:var(--base-3);color:var(--muted);border:1px solid var(--line);
    position:relative;z-index:1;transition:.25s}
  .st-running .cue{background:var(--accent);color:var(--on-accent);border-color:var(--accent);
    animation:pulse 1.15s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}
                   70%{box-shadow:0 0 0 9px transparent}}
  .st-ok .cue{background:color-mix(in srgb,var(--ok) 16%,var(--base-3));color:var(--ok);
    border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
  .st-failed .cue{background:color-mix(in srgb,var(--bad) 18%,var(--base-3));color:var(--bad);
    border-color:color-mix(in srgb,var(--bad) 50%,transparent)}
  .st-skipped .cue{opacity:.45}
  .sbody{flex:1;min-width:0;padding-top:3px}
  .sbody .t{font-weight:700;font-size:.96rem;display:flex;gap:10px;align-items:baseline}
  .sbody .d{color:var(--muted);font-size:.84rem}
  .st-pending .sbody{opacity:.42}
  .st-running .sbody .t{color:var(--accent)}
  .ms{margin-left:auto;font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums;
    font-family:var(--mono);flex:none}
  .note{margin-top:4px;font-size:.83rem;color:var(--bad);white-space:pre-wrap}

  /* ---------- log ---------- */
  .log{font-family:var(--mono);font-size:.78rem;line-height:1.75;padding:12px 18px;
    max-height:430px;overflow:auto}
  .log div{display:flex;gap:11px;white-space:pre-wrap;word-break:break-word}
  .log .tm{color:var(--muted);flex:none;opacity:.6}
  .log .sg{color:var(--accent);flex:none;min-width:66px;opacity:.85}
  .log .warn .mg{color:var(--warn)}
  .log .error .mg{color:var(--bad)}
  .log .mg{color:color-mix(in srgb,var(--ink) 88%,transparent)}

  /* ---------- result ---------- */
  .result{padding:18px}
  .result.hide{display:none}
  .headline{font-size:1.28rem;font-weight:800;letter-spacing:-.01em;margin:0 0 4px}
  .headline.bad{color:var(--bad)}
  .sub2{color:var(--muted);font-size:.9rem;margin:0 0 16px}
  .links{display:grid;gap:9px}
  .link{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);
    border-radius:var(--radius-sm);background:var(--base-3);text-decoration:none;color:inherit}
  .link:hover{border-color:var(--accent)}
  .link .ic{width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--on-accent);
    display:grid;place-items:center;font-size:13px;font-weight:800;flex:none}
  .link .lb{font-weight:700;font-size:.92rem}
  .link .u{color:var(--muted);font-size:.78rem;font-family:var(--mono);word-break:break-all}
  .checks{margin-top:16px;display:grid;gap:5px}
  .chk{display:flex;gap:9px;font-size:.84rem;align-items:baseline}
  .chk .m{flex:none;font-weight:800}
  .chk.ok .m{color:var(--ok)} .chk.no .m{color:var(--bad)}
  .chk .x{color:var(--muted)}
  .empty{padding:34px 18px;text-align:center;color:var(--muted);font-size:.9rem}
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.7rem;font-weight:750;
    letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);color:var(--muted)}
  .pill.live{border-color:var(--accent);color:var(--accent)}
</style>

<script>
"use strict";

/* Two ways this page gets its data:
     - live   : a local server exposes /api/run?after=N while the build runs
     - replay : a finished run is baked into window.__RUN__ / window.__EVENTS__
   The rendering is identical, so a build looks the same while it happens and afterwards. */
const TOKEN = new URLSearchParams(location.search).get("t") || "";
const LIVE   = !window.__RUN__;
let   after  = 0, RUN = window.__RUN__ || null, finished = !LIVE, t0 = null;
const EVENTS = window.__EVENTS__ || [];

const $ = (id) => document.getElementById(id);

function fmt(sec){
  if (sec == null) return "—";
  if (sec < 60) return sec.toFixed(1) + "s";
  const m = Math.floor(sec / 60), s = Math.round(sec % 60);
  return m + "m " + String(s).padStart(2, "0") + "s";
}
function esc(s){ const d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; }

/* ---------- theme: the forge that is running paints the page ---------- */
function paintTheme(run){
  const f = (run.archetype && run.archetype.forge) || {};
  if (f.accent)   document.documentElement.style.setProperty("--accent", f.accent);
  if (f.accent_2) document.documentElement.style.setProperty("--accent-2", f.accent_2);
  if (f.base)     document.documentElement.style.setProperty("--base", f.base);
  if (f.base_soft)document.documentElement.style.setProperty("--base-2", f.base_soft);
  $("forgeName").childNodes[0].nodeValue = f.name || "FORGE";
  $("anvil").textContent = (f.name || "F").slice(0,1);
  document.title = (f.name || "Forge") + " · " + (run.business || "");
}

/* ---------- header ---------- */
function paintHead(run){
  $("bizName").textContent = run.business + (run.archetype ? " — " + run.archetype.label : "");
  $("target").textContent  = run.target || "—";
  $("arch").textContent    = (run.archetype && run.archetype.id) || "—";
  const p = run.progress || {done:0,total:1};
  $("progress").style.width = Math.round(100 * p.done / Math.max(1, p.total)) + "%";
  const running = (run.stages || []).find(s => s.state === "running");
  $("stageNow").textContent = running ? running.title.split(" · ")[0]
                            : (run.outcome === "running" ? "—" : run.outcome);
  document.body.dataset.state = run.outcome;
}

/* ---------- stage rail: the cues ---------- */
const GLYPH = { ok:"✓", failed:"✗", skipped:"–" };
function paintRail(run){
  const rail = $("rail");
  rail.innerHTML = (run.stages || []).map(s => {
    const glyph = GLYPH[s.state] || s.cue || "·";
    const time  = s.state === "ok" && s.ms != null ? (s.ms >= 1000 ? (s.ms/1000).toFixed(1)+"s" : s.ms+" ms")
                : s.state === "skipped" ? "skipped" : "";
    return '<li class="st-' + s.state + '">' +
      '<div class="cue">' + esc(glyph) + '</div>' +
      '<div class="sbody"><div class="t">' + esc(s.title) +
        (time ? '<span class="ms">' + esc(time) + '</span>' : '') + '</div>' +
      '<div class="d">' + esc(s.detail || "") + '</div>' +
      (s.state === "failed" && s.note ? '<div class="note">' + esc(s.note) + '</div>' : '') +
      '</div></li>';
  }).join("");
}

/* ---------- log ---------- */
function appendLog(evs){
  const log = $("log");
  if (log.querySelector(".empty")) log.innerHTML = "";
  const atEnd = log.scrollTop + log.clientHeight >= log.scrollHeight - 40;
  evs.forEach(ev => {
    if (ev.kind === "stage_start" || ev.kind === "run_start" || ev.kind === "log"
        || (ev.kind === "stage_end" && (ev.level === "error" || (ev.data||{}).state === "skipped"))
        || ev.kind === "run_end") {
      const row = document.createElement("div");
      row.className = ev.level || "info";
      row.innerHTML = '<span class="tm">' + esc(ev.t.toFixed(2)) + '</span>' +
                      '<span class="sg">' + esc(ev.stage || "forge") + '</span>' +
                      '<span class="mg">' + esc(ev.msg) + '</span>';
      log.appendChild(row);
    }
  });
  if (atEnd) log.scrollTop = log.scrollHeight;
}

/* ---------- result ---------- */
const LABEL = { url:["◱","The site"], platform_url:["▣","The business platform"],
                receipt:["◇","Build receipt"], site:["▤","Site source"],
                platform:["▣","Platform source"], tenant:["◈","Hub tenant"] };
function paintResult(run){
  if (run.outcome === "running") return;
  const box = $("result");
  box.classList.remove("hide");
  const failed = run.outcome === "failed";
  const bad = (run.stages || []).find(s => s.state === "failed");
  const el = run.elapsed;

  const links = Object.entries(run.artifacts || {})
    .filter(([k,v]) => LABEL[k] && typeof v === "string" && v)
    .map(([k,v]) => {
      const [ic, lb] = LABEL[k];
      const href = /^https?:|^file:/.test(v) ? v : "file://" + v;
      return '<a class="link" href="' + esc(href) + '" target="_blank" rel="noopener">' +
             '<span class="ic">' + esc(ic) + '</span><span><span class="lb">' + esc(lb) +
             '</span><br><span class="u">' + esc(v) + '</span></span></a>';
    }).join("");

  const checks = (run.checks || []).map(c =>
    '<div class="chk ' + (c.ok ? "ok" : "no") + '"><span class="m">' + (c.ok ? "✓" : "✗") +
    '</span><span>' + esc(c.id) + ' <span class="x">— ' + esc(c.detail) + '</span></span></div>'
  ).join("");

  box.innerHTML =
    '<div class="result">' +
    '<h2 class="headline' + (failed ? ' bad' : '') + '">' +
      (failed ? "Stopped at " + esc(bad ? bad.title : "a stage")
              : esc(run.business) + " is " + esc(run.outcome)) + '</h2>' +
    '<p class="sub2">' + (failed
        ? esc((bad && bad.note) || "The run did not complete. Nothing was deployed.")
        : "Built and " + (run.target === "local" ? "ready to open" : "deployed") +
          " in <strong>" + fmt(el) + "</strong> · " + esc(run.fingerprint || "")) + '</p>' +
    (links ? '<div class="links">' + links + '</div>' : '') +
    (checks ? '<div class="checks">' + checks + '</div>' : '') +
    '</div>';
}

/* ---------- clock ---------- */
setInterval(() => {
  if (finished || !t0) return;
  $("clock").textContent = fmt((Date.now() - t0) / 1000);
}, 100);

function render(run){
  if (!run) return;
  RUN = run;
  paintTheme(run); paintHead(run); paintRail(run); paintResult(run);
  if (run.outcome !== "running"){
    finished = true;
    $("clock").textContent = fmt(run.elapsed);
  } else if (!t0){
    t0 = Date.now() - (run.elapsed || 0) * 1000;
  }
}

/* ---------- live polling ---------- */
async function poll(){
  try {
    const r = await fetch("/api/run?after=" + after + (TOKEN ? "&t=" + encodeURIComponent(TOKEN) : ""));
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    if (d.events && d.events.length){
      after = d.events[d.events.length - 1].seq;
      appendLog(d.events);
    }
    if (d.run) render(d.run);
    if (d.run && d.run.outcome !== "running") return;   // done — stop polling
  } catch(e){ /* the server goes away when the run ends; the last render stands */ }
  setTimeout(poll, 400);
}

if (LIVE){ poll(); }
else { appendLog(EVENTS); render(RUN); }
</script>
