<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOM 100 — Business Command Center</title>
<style>
  :root{
    --navy:#071a2f; --navy2:#092033; --blue:#0b3d91; --teal:#00a6a6; --teal2:#8be8e8;
    --orange:#ff8a3d; --ink:#102033; --muted:#5f6b7a; --soft:#f5f8fb; --line:#e7edf4;
    --card:#ffffff; --good:#1f9d6b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);background:var(--soft);line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1320px;margin:0 auto;padding:0 24px}

  header{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 55%,var(--blue) 150%);color:#fff;padding:26px 0 24px}
  .hrow{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:13px}
  .logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--teal),var(--blue));
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;box-shadow:0 6px 20px rgba(0,166,166,.35)}
  h1{font-size:21px;font-weight:800}
  .sub{color:var(--teal2);font-size:12.5px;font-weight:500;margin-top:2px}
  .addbtn{background:var(--orange);color:#231000;border:none;font-weight:700;font-size:14px;padding:11px 18px;border-radius:10px;cursor:pointer;box-shadow:0 6px 18px rgba(255,138,61,.35);transition:.15s}
  .addbtn:hover{transform:translateY(-1px);filter:brightness(1.05)}
  .goal{margin-top:20px}
  .goal .lab{display:flex;justify-content:space-between;font-size:12px;color:#cfe0f2;margin-bottom:6px;font-weight:600}
  .bar{height:11px;background:rgba(255,255,255,.14);border-radius:20px;overflow:hidden}
  .bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--teal2));border-radius:20px;transition:width .6s ease}
  .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-top:18px}
  .kpi{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);border-radius:11px;padding:11px 13px}
  .kpi b{display:block;font-size:23px;font-weight:800;line-height:1}
  .kpi span{font-size:10.5px;color:#bcd0e6;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
  .kpi.k1 b{color:var(--teal2)} .kpi.k2 b{color:#a9e5ff} .kpi.k3 b{color:#ffd7b0} .kpi.k4 b{color:#ffb98f} .kpi.k5 b{color:#c9b8ff}

  .controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:22px 0 8px}
  .search{flex:1;min-width:220px;position:relative}
  .search input{width:100%;padding:11px 14px 11px 38px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:#fff}
  .search svg{position:absolute;left:12px;top:12px;opacity:.45}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:#fff;color:var(--muted);font-size:12.5px;font-weight:600;padding:8px 13px;border-radius:20px;cursor:pointer;transition:.12s;white-space:nowrap}
  .chip:hover{border-color:var(--teal)} .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .rowlabel{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin:14px 0 8px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;margin:12px 0 30px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:.16s;box-shadow:0 1px 2px rgba(16,32,51,.04);display:flex;flex-direction:column}
  .card:hover{box-shadow:0 14px 30px rgba(16,32,51,.13);transform:translateY(-3px)}
  .cover{height:120px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .cover .mono{font-size:30px;font-weight:800;color:rgba(255,255,255,.9);letter-spacing:1px;text-shadow:0 2px 12px rgba(0,0,0,.2)}
  .badge{position:absolute;top:10px;left:10px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;padding:4px 9px;border-radius:20px;background:rgba(0,0,0,.55);color:#fff;backdrop-filter:blur(3px)}
  .badge.live{background:rgba(31,157,107,.92)}
  .srcpill{position:absolute;top:10px;right:10px;font-size:10px;font-weight:700;padding:4px 9px;border-radius:20px;background:rgba(255,255,255,.9);color:var(--ink)}
  .cbody{padding:13px 15px 15px}
  .cname{font-size:15px;font-weight:800;letter-spacing:.1px;display:flex;align-items:center;gap:6px}
  .cdesc{font-size:12.5px;color:#586574;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .cmeta{display:flex;align-items:center;justify-content:space-between;margin-top:11px}
  .catdot{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);font-weight:600}
  .catdot i{width:8px;height:8px;border-radius:50%;display:inline-block}
  .livelink{font-size:11.5px;font-weight:700;color:var(--blue)}

  .empty{text-align:center;color:var(--muted);padding:60px 0;font-size:14px}
  footer{color:var(--muted);font-size:12px;text-align:center;padding:22px 0 44px}

  /* Detail overlay */
  .detail{position:fixed;inset:0;background:rgba(7,26,47,.6);backdrop-filter:blur(4px);display:none;z-index:60;overflow:auto;padding:34px 16px}
  .detail.show{display:block}
  .dpanel{background:#fff;max-width:760px;margin:0 auto;border-radius:18px;overflow:hidden;box-shadow:0 30px 70px rgba(7,26,47,.45)}
  .dcover{height:180px;display:flex;align-items:flex-end;padding:18px 24px;position:relative}
  .dcover .dmono{font-size:44px;font-weight:800;color:rgba(255,255,255,.92);text-shadow:0 3px 16px rgba(0,0,0,.25)}
  .dclose{position:absolute;top:16px;right:16px;background:rgba(0,0,0,.4);color:#fff;border:none;width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer}
  .dbody{padding:22px 24px 26px}
  .dtop{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .dname{font-size:23px;font-weight:800}
  .dtags{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
  .tag{font-size:11px;font-weight:700;padding:4px 11px;border-radius:20px;background:var(--soft);border:1px solid var(--line);color:var(--ink)}
  .tag.live{background:#dff5ec;border-color:#bfe9d7;color:#0e7a52}
  .ddesc{font-size:14.5px;color:#33414f;margin:18px 0;line-height:1.6}
  .dfields{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0 20px}
  .fld{background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:12px 14px}
  .fld b{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:4px}
  .fld span{font-size:13.5px;color:var(--ink)}
  .dactions{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
  .btn{padding:11px 18px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);display:inline-flex;align-items:center;gap:7px}
  .btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
  .btn.live{background:var(--good);color:#fff;border-color:var(--good)}
  .btn.danger{color:#c0392b;border-color:#f0d0cc;margin-left:auto}
  .btn:hover{filter:brightness(.97)}
  .muted-note{font-size:12px;color:var(--muted);margin-top:14px}

  /* Modal form */
  .ov{position:fixed;inset:0;background:rgba(7,26,47,.55);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;z-index:70;padding:40px 16px;overflow:auto}
  .ov.show{display:flex}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:580px;padding:24px}
  .modal h3{font-size:18px;font-weight:800;margin-bottom:16px}
  .fg{margin-bottom:13px}
  .fg label{display:block;font-size:11.5px;font-weight:700;color:var(--ink);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
  .fg input,.fg textarea,.fg select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit}
  .fg textarea{resize:vertical;min-height:60px}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .mfoot{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  .mfoot .right{display:flex;gap:10px}
  @media(max-width:720px){.kpis{grid-template-columns:repeat(3,1fr)}.frow,.dfields{grid-template-columns:1fr}}
</style>
</head>

<div class="ov" id="ov">

    </div>
    <div class="fg"><label>Live / preview URL</label><input id="f_live" placeholder="https://…"></div>
    <div class="fg"><label>Editor / project URL</label><input id="f_link" placeholder="https://…"></div>
    <div class="fg"><label>Next action</label><input id="f_next" placeholder="optional"></div>
    <div class="mfoot">
      <button class="btn danger" id="delBtn" onclick="delItem()" style="visibility:hidden;margin-left:0">Delete</button>
      <div class="right">
        <button class="btn" onclick="closeModal()">Cancel</button>

      </div>
    </div>
  </div>
</div>

const KEY="vom100:ventures:v2";
let data=load();
let activeCat="All", activeFilter="All";

function load(){ try{const r=localStorage.getItem(KEY); if(r) return JSON.parse(r);}catch(e){}
  return SEED.map((v,i)=>({id:"s"+i,...v})); }
function save(){ try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){} }

function esc(t){return (t||"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function initials(n){return n.replace(/[^A-Za-z0-9 ]/g,"").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();}
function grad(cat){const g=CATGRAD[cat]||["#334","#556"];return `linear-gradient(135deg,${g[0]},${g[1]})`;}

function paintTop(){
  const s={Live:0,Built:0,Prototype:0,Idea:0};
  data.forEach(v=>{ if(v.stage==="Live")s.Live++; else if(v.stage==="Built")s.Built++; else if(v.stage==="Idea"||v.stage==="Planned")s.Idea++; else s.Prototype++; });
  const liveLinks=data.filter(v=>v.live).length;
  document.getElementById("kpis").innerHTML=`
    <div class="kpi"><b>${data.length}</b><span>Registered</span></div>
    <div class="kpi k1"><b>${s.Live}</b><span>Live</span></div>
    <div class="kpi k2"><b>${s.Built}</b><span>Built</span></div>
    <div class="kpi k3"><b>${s.Prototype}</b><span>In build</span></div>
    <div class="kpi k4"><b>${s.Idea}</b><span>Ideas</span></div>
    <div class="kpi k5"><b>${liveLinks}</b><span>Live links</span></div>`;
  const pct=Math.min(100,Math.round(data.length/GOAL*100));
  document.getElementById("goalBar").style.width=pct+"%";
  document.getElementById("goalTxt").textContent=data.length+" / "+GOAL;
}
function paintChips(){
  document.getElementById("catChips").innerHTML=["All",...CATS].map(c=>`<button class="chip ${activeCat===c?'on':''}" onclick="setCat('${c.replace(/'/g,"\\'")}')">${c}${c!=="All"?` <span style="opacity:.6">${data.filter(v=>v.cat===c).length}</span>`:""}</button>`).join("");
  document.getElementById("filterChips").innerHTML=["All",...SOURCES,...STAGES].map(f=>`<button class="chip ${activeFilter===f?'on':''}" onclick="setFilter('${f}')">${f}</button>`).join("");
}
function setCat(c){activeCat=c;paintChips();render();}
function setFilter(f){activeFilter=f;paintChips();render();}

function match(v){
  const q=document.getElementById("q").value.trim().toLowerCase();
  if(activeCat!=="All"&&v.cat!==activeCat) return false;
  if(activeFilter!=="All"&&v.src!==activeFilter&&v.stage!==activeFilter) return false;
  if(q){const hay=(v.name+" "+v.desc+" "+v.cat+" "+v.src).toLowerCase(); if(!hay.includes(q)) return false;}
  return true;
}
function render(){
  paintTop();
  const items=data.filter(match);
  const host=document.getElementById("grid");
  if(!items.length){host.innerHTML=`<div class="empty" style="grid-column:1/-1">No ventures match. <a href="#" onclick="openModal();return false" style="color:var(--blue);font-weight:700">Register one</a>.</div>`;foot();return;}
  host.innerHTML=items.map(cardHTML).join("");
  foot();
}
function cardHTML(v){
  const isLive=!!v.live;
  return `<div class="card" onclick="openDetail('${v.id}')">
    <div class="cover" style="background:${grad(v.cat)}">
      <span class="mono">${esc(initials(v.name))}</span>
      <span class="badge ${isLive?'live':''}">${isLive?'● Live':esc(v.stage)}</span>
      <span class="srcpill">${esc(v.src)}</span>
    </div>
    <div class="cbody">
      <div class="cname">${esc(v.name)}</div>
      <div class="cdesc">${esc(v.desc)}</div>
      <div class="cmeta">
        <span class="catdot"><i style="background:${CATDOT[v.cat]}"></i>${esc(v.cat)}</span>
        ${isLive?'<span class="livelink">Live ↗</span>':(v.link?'<span class="livelink" style="color:var(--muted)">Open ↗</span>':'')}
      </div>
    </div>
  </div>`;
}
function foot(){ const left=GOAL-data.length;
  document.getElementById("foot").innerHTML=`${data.length} ventures registered · ${data.filter(v=>v.live).length} with live links · ${left>0?left+' to reach 100':'goal reached 🎉'} · saved on this device`; }

// ---- Detail ----
function openDetail(id){
  const v=data.find(x=>x.id===id); if(!v) return;
  const isLive=!!v.live;
  document.getElementById("dpanel").innerHTML=`
    <div class="dcover" style="background:${grad(v.cat)}">
      <span class="dmono">${esc(initials(v.name))}</span>
      <button class="dclose" onclick="closeDetail()">✕</button>
    </div>
    <div class="dbody">
      <div class="dtop">
        <div>
          <div class="dname">${esc(v.name)}</div>
          <div class="dtags">
            <span class="tag ${isLive?'live':''}">${isLive?'● Live':esc(v.stage)}</span>
            <span class="tag">${esc(v.cat)}</span>
            <span class="tag">${esc(v.src)}</span>
          </div>
        </div>
      </div>
      <div class="ddesc">${esc(v.desc)}</div>
      <div class="dfields">
        ${v.rev?`<div class="fld"><b>Revenue model</b><span>${esc(v.rev)}</span></div>`:""}
        ${v.next?`<div class="fld"><b>Next action</b><span>${esc(v.next)}</span></div>`:""}
        <div class="fld"><b>Stage</b><span>${esc(v.stage)}</span></div>
        <div class="fld"><b>Source</b><span>${esc(v.src)}</span></div>
      </div>
      <div class="dactions">
        ${v.live?`<a class="btn live" href="${encodeURI(v.live)}" target="_blank" rel="noopener">🔗 Open live site</a>`:""}
        ${v.link?`<a class="btn primary" href="${encodeURI(v.link)}" target="_blank" rel="noopener">↗ Open in ${esc(v.src)}</a>`:""}
        <button class="btn" onclick="editItem('${v.id}')">✎ Edit</button>
        <button class="btn danger" onclick="delFromDetail('${v.id}')">Delete</button>
      </div>
      ${(!v.live&&!v.link)?'<div class="muted-note">No live or project link yet — add one with Edit.</div>':""}
    </div>`;
  document.getElementById("detail").classList.add("show");
}
function closeDetail(){document.getElementById("detail").classList.remove("show");}
function delFromDetail(id){ data=data.filter(x=>x.id!==id); save(); closeDetail(); render(); }

// ---- Modal ----
let editing=null;
function fillSelects(){
  document.getElementById("f_cat").innerHTML=CATS.map(c=>`<option>${c}</option>`).join("");
  document.getElementById("f_stage").innerHTML=STAGES.map(s=>`<option>${s}</option>`).join("");
  document.getElementById("f_src").innerHTML=SOURCES.concat(["Other"]).map(s=>`<option>${s}</option>`).join("");
}
function openModal(){
  editing=null; document.getElementById("mTitle").textContent="Register venture";
  document.getElementById("delBtn").style.visibility="hidden";
  ["f_name","f_desc","f_rev","f_next","f_live","f_link"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("f_cat").value=CATS[3]; document.getElementById("f_stage").value="Idea"; document.getElementById("f_src").value="Claude";
  document.getElementById("ov").classList.add("show");
}
function editItem(id){
  const v=data.find(x=>x.id===id); if(!v) return; editing=id; closeDetail();
  document.getElementById("mTitle").textContent="Edit venture";
  document.getElementById("delBtn").style.visibility="visible";
  document.getElementById("f_name").value=v.name; document.getElementById("f_desc").value=v.desc;
  document.getElementById("f_cat").value=v.cat; document.getElementById("f_stage").value=v.stage;
  document.getElementById("f_src").value=SOURCES.includes(v.src)?v.src:"Other";
  document.getElementById("f_rev").value=v.rev||""; document.getElementById("f_next").value=v.next||"";
  document.getElementById("f_live").value=v.live||""; document.getElementById("f_link").value=v.link||"";
  document.getElementById("ov").classList.add("show");
}
function closeModal(){document.getElementById("ov").classList.remove("show");}
function saveItem(){
  const name=document.getElementById("f_name").value.trim(); if(!name){document.getElementById("f_name").focus();return;}
  const obj={name,desc:document.getElementById("f_desc").value.trim(),cat:document.getElementById("f_cat").value,
    stage:document.getElementById("f_stage").value,src:document.getElementById("f_src").value,
    rev:document.getElementById("f_rev").value.trim(),next:document.getElementById("f_next").value.trim(),
    live:document.getElementById("f_live").value.trim(),link:document.getElementById("f_link").value.trim()};
  if(editing){Object.assign(data.find(x=>x.id===editing),obj);}
  else{obj.id="u"+Date.now();data.unshift(obj);}
  save();closeModal();render();
}
function delItem(){ if(!editing)return; data=data.filter(x=>x.id!==editing); save(); closeModal(); render(); }

document.getElementById("ov").addEventListener("click",e=>{if(e.target.id==="ov")closeModal();});
document.getElementById("detail").addEventListener("click",e=>{if(e.target.id==="detail")closeDetail();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeModal();closeDetail();}});

fillSelects();paintChips();render();
</script>
