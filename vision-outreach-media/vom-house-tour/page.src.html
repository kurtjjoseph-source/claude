<script>
(function(){
"use strict";

/* ------------------------------------------------------------------ sources
   Real, live Vision Outreach Media surfaces. Everything quoted in a room is
   read off one of these, so a visitor can check the guide.                  */
var S = {
  core   :{n:"visionoutreachmedia.nl", u:"https://visionoutreachmedia.nl"},
  gallery:{n:"What we build",          u:"https://vom-gallery.vercel.app"},
  forge  :{n:"Turnkey · Forge",        u:"https://vom-forge.vercel.app"},
  engage :{n:"Engage AI",              u:"https://engage-ai-api.onrender.com/dashboard"},
  grow   :{n:"Three ways we grow",     u:"https://vom-grow.vercel.app"},
  hundred:{n:"Hundred — Growth OS",    u:"https://hundred-theta.vercel.app"},
  studio :{n:"Studio Index",           u:"https://artifact-hub-nu.vercel.app"},
  intent :{n:"Intent browsing",        u:"https://vom-intent.vercel.app"},
  door   :{n:"The front door",         u:"https://vom-front-door.vercel.app"}
};

/* the ten build types, with the figures the gallery states for each */
var KINDS = [
  ["Churches",7,10],["One-person studios",7,9],["Charities",6,10],["Shops",5,9],
  ["Digital products",5,8],["Clubs & memberships",5,10],["Courses & schools",5,11],
  ["Venues",5,10],["Software",5,8],["Ideas not yet built",2,5]
];
var CHANNELS = ["Website","Google Business","YouTube","Facebook","Instagram","LinkedIn","X","News coverage"];

/* --------------------------------------------------------------------- rooms */
var ROOMS = [
{ id:"hall", n:"The entrance hall", eyebrow:"Where you are",
  h:"A studio that builds the website and the office behind it as one thing.",
  lede:"Most businesses end up with a site from one supplier and a pile of spreadsheets from "
     + "another, then spend years typing everything into both. Everything in this house exists "
     + "to stop that. Walk through it in any order — the map on the left is the whole building.",
  facts:[
    {k:"Where",v:"Netherlands",n:"A studio working with churches, ministries, nonprofits and small businesses.",s:"core"},
    {k:"What is built",v:"Two halves",n:"The public site and the back office behind it, made together rather than joined later.",s:"gallery"},
    {k:"Rooms in this house",v:"7",n:"Each one is a real part of the studio with its own working output.",s:"door"}
  ],
  link:"core", linkText:"Open the studio's own site",
  say:"Good afternoon. You're in the entrance hall — nothing to read here, it's just where I "
    + "explain the shape of the place. The house has seven rooms and you may see them in any "
    + "order. <em>Shall I take you to the workshop first?</em> It's where most of the work is." },

{ id:"workshop", n:"The workshop", eyebrow:"Room one",
  h:"Ten kinds of business, each fully worked out.",
  lede:"A church and a venue do not need the same website with a different photo on it, so they "
     + "do not get one. Each of these is built in its own world, and each ends at a working "
     + "example you can click through. The two numbers are how many pages the platform has and "
     + "how many back-office modules sit behind it.",
  table:true,
  facts:[
    {k:"Kinds of business",v:"10",n:"Each one fully worked out, not a template with the words swapped.",s:"gallery"},
    {k:"Live examples",v:"10",n:"One per kind, openable right now without asking anybody.",s:"gallery"},
    {k:"Your keys held by us",v:"0",n:"Payments, email and analytics are wired to the owner's own accounts.",s:"gallery"}
  ],
  link:"gallery", linkText:"Walk the workshop yourself",
  say:"This is the workshop. Ten kinds of business, and I'd point you at the table rather than "
    + "the headline — the page and module counts differ per kind, which is the whole argument. "
    + "<em>Courses need eleven modules; a shop needs nine.</em>" },

{ id:"instruments", n:"The instrument room", eyebrow:"Room two",
  h:"Your public footprint, scored across eight channels.",
  lede:"Measured on the same rubric every month, so “we should post more” becomes a ranked list "

  channels:true,
  facts:[
    {k:"Channels scored",v:"8",n:"Each measured separately rather than rolled into one vanity number.",s:"gallery"},
    {k:"Cadence",v:"Monthly",n:"The same rubric each time, so the movement means something.",s:"gallery"},
    {k:"Also runs on",v:"Competitors",n:"The same eight channels, scored the same way.",s:"gallery"}
  ],
  link:"engage", linkText:"Open the control room",

    + "separate ones tell you <em>which room the draught is coming from</em>." },

{ id:"floor", n:"The machine floor", eyebrow:"Room three",
  h:"The part that builds a platform with nobody in the loop.",
  lede:"Turnkey decides what a business needs and compiles it into a blueprint. Forge executes "
     + "that blueprint end to end — composing the modules, writing the site, checking its own "
     + "work, deploying, and proving what it deployed is answering.",
  facts:[
    {k:"Archetype platforms",v:"10",n:"One per kind of business in the workshop.",s:"forge"},

    {k:"Stages, each checked",v:"11",n:"It refuses an unready spec rather than producing a half-decided platform.",s:"forge"},
    {k:"Human steps in a run",v:"0",n:"Nobody stands in the middle translating between documents.",s:"forge"}
  ],
  link:"forge", linkText:"See the machine floor",
  say:"Mind the noise. Ten platforms in <em>0.63 seconds</em>, eleven checked stages, nobody in "

    + "and read the stage list than took my word." },

{ id:"proving", n:"The proving ground", eyebrow:"Room four",
  h:"Evidence before investment.",
  lede:"A single page that makes one promise and counts who says yes. Deployed on its own, so it "
     + "keeps collecting while the real thing is built — or tells you not to build it. An "
     + "afternoon, against six months of building the wrong thing.",
  facts:[
    {k:"What it is",v:"One page",n:"One promise, and a count of who said yes to it.",s:"gallery"},
    {k:"Costs you",v:"An afternoon",n:"Set against six months of building something nobody wanted.",s:"gallery"},
    {k:"Can also say",v:"Don't build it",n:"Which is the outcome that saves the most money.",s:"gallery"}
  ],
  link:"grow", linkText:"The three engagements, written plainly",

{ id:"library", n:"The library", eyebrow:"Room five",
  h:"Everything the studio has published, in one menu.",
  lede:"Tools, guides, dashboards and wizards, added automatically as they ship. The house keeps "

  facts:[
    {k:"Operating systems",v:"6",n:"All six now deliver what they promise.",s:"studio"},
    {k:"House readiness",v:"40%",n:"The studio's own audit of itself. The gap is the storefront layer: buyable, deliverable, provable.",s:"studio"},
    {k:"Index updates",v:"Daily",n:"New artifacts are added automatically rather than by hand.",s:"studio"}
  ],
  link:"studio", linkText:"Open the index",
  say:"The library. I'll draw your attention to the forty per cent — that's the studio's audit "

    + "the hallway." },

{ id:"lab", n:"The workbench", eyebrow:"Room six",
  h:"Where the house experiments on itself.",
  lede:"This tour is one of the experiments. The interface you are using — a guide instead of a "
     + "navigation bar — comes out of work on intent-led browsing, where you state an outcome "
     + "and the surface composes itself around it rather than making you hunt for a page.",
  facts:[
    {k:"You are inside",v:"An experiment",n:"A guided walk rather than a menu. There is no navigation bar anywhere on this page.",s:"door"},
    {k:"The model",v:"Intent-led",n:"State an outcome; the surface composes. The thinking is written out in full.",s:"intent"},
    {k:"Also built on it",v:"The front door",n:"The same idea applied to a landing page that answers instead of listing.",s:"door"}
  ],
  link:"intent", linkText:"Read the thinking behind this interface",
  say:"The workbench — and you're standing in the experiment. There's no navigation on this "
    + "page at all; you've been getting around by <em>asking me</em>. Whether that's better "
    + "than a menu is exactly the open question." },

{ id:"office", n:"The office", eyebrow:"The way out",
  h:"Four steps, and you are running it.",
  lede:"Tell us what the business is — a paragraph is enough. We build it and you look at the "
     + "actual thing, live on a real address, not a wireframe. You say what is wrong and it gets "
     + "rebuilt rather than patched, which is why changing your mind is cheap here. Then you run "
     + "it, on your own accounts.",
  steps:["Tell us what the business is. A paragraph is enough: what it does, who for, what it charges.",
         "We build it and you look at it — the actual site and back office, live, seeded so it opens with something in it.",
         "You say what is wrong. It gets rebuilt, not patched.",
         "You run it. Payments, email and analytics wired to your own accounts."],
  facts:[
    {k:"Steps",v:"4",n:"From a paragraph to a system you run yourself.",s:"gallery"},
    {k:"What you're shown",v:"The real thing",n:"Not a wireframe and not a slide.",s:"gallery"},
    {k:"Changing your mind",v:"Cheap",n:"Because it is rebuilt rather than patched.",s:"gallery"}
  ],
  link:"core", linkText:"Start a conversation on the studio's site",
  say:"And this is the office, where a tour normally turns into a sales pitch. I'll spare you: "
    + "<em>nothing on this page sends anything to anybody.</em> When you want to talk to a "
    + "person, the studio's own site is the door." }
];

/* ------------------------------------------------------------------ answers
   A small, honest question set. Bram answers from the rooms; when he cannot,
   he says so and does not invent.                                          */
var QA = [
  [/how long|how fast|speed|quick|time to build|0\.63|\bsecond/i,
   "Ten archetype platforms build in <em>0.63 seconds</em>, across eleven checked stages with no "
 + "human steps in the run. That is machine time, not project time — a real engagement still has "
 + "a conversation at the front of it.", "floor"],
  [/cost|price|pricing|budget|how much|charge|fee|euro|€/i,
   "I won't quote you a number, because there isn't an honest one on this page to quote. What I "
 + "can tell you is the shape: you're shown the real thing before you commit, and revisions are "
 + "rebuilds rather than patches. <em>Pricing is a conversation the studio has directly.</em>",
   "office"],
  [/channel|social|instagram|facebook|linkedin|youtube|seo|found|visib|reach/i,
   "Eight channels, scored separately on the same rubric every month — website, Google Business, "
 + "YouTube, Facebook, Instagram, LinkedIn, X and news coverage. The same run works on your "
 + "competitors too.", "instruments"],
  [/church|ministr|nonprofit|charit|faith/i,
   "That's the work this studio was built for. Churches take seven pages and ten back-office "
 + "modules; charities six and ten. There's a worked example for each you can open.", "workshop"],
  [/example|proof|show me|see it|demo|portfolio|work/i,
   "Ten live examples, one per kind of business, openable right now without asking anyone. "
 + "That's the workshop.", "workshop"],
  [/idea|not sure|validate|test|maybe|before i|risk/i,
   "Then you want the proving ground rather than the workshop — one page, one promise, a count "
 + "of who says yes. It's allowed to tell you not to build the thing.", "proving"],
  [/who are you|what are you|are you\b[^?]{0,20}\b(ai|bot|real|human|person|scripted)|chatgpt|model|llm/i,
   "A scripted guide. I'm a few hundred lines of rules that know this house — there's no model "
 + "behind me and nothing you type leaves your browser. <em>I'd rather tell you that than have "
 + "you assume otherwise.</em>", null],
  [/contact|talk|call|email|human|person|hire|start/i,
   "The office is the way out, and the studio's own site is where a real conversation starts. "
 + "Nothing on this page sends anything.", "office"],
  [/back office|spreadsheet|admin|module|system/i,
   "That's the whole argument of the house: the site and the back office are built together, so "
 + "what the owner types into Events is what a visitor reads on the site. Module counts differ "
 + "per kind of business.", "workshop"]
];

/* ------------------------------------------------------------------- state */
var at = 0, seen = {}, asked = 0;

function $(id){ return document.getElementById(id); }
function el(t,c,x){ var n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];}); }
function src(key){
  var s=S[key], a=el("a","h-src",s.n);
  a.href=s.u; a.target="_blank"; a.rel="noopener"; a.title="Opens "+s.u;
  return a;
}

/* --------------------------------------------------------------- rendering */
function paintMap(){
  var ol=$("h-map"); ol.textContent="";
  ROOMS.forEach(function(r,i){
    var li=document.createElement("li");
    var b=el("button","h-maprow"+(seen[r.id]?" seen":""));
    b.type="button";
    b.setAttribute("aria-current", i===at ? "true":"false");
    b.appendChild(el("span","n", i===0 ? "ENTRANCE" : i===ROOMS.length-1 ? "EXIT" : "ROOM "+i));
    b.appendChild(el("span","t", r.n));
    b.addEventListener("click",function(){ go(i,"map"); });
    li.appendChild(b); ol.appendChild(li);
  });
  var n=0; for(var k in seen) if(seen[k]) n++;
  $("h-prog").textContent = n+" of "+ROOMS.length+" rooms seen";
}

function paintRoom(){
  var r=ROOMS[at], m=$("h-room"); m.textContent="";
  m.appendChild(el("p","h-eyebrow", r.eyebrow+" · "+r.n));
  m.appendChild(el("h2",null,r.h));
  m.appendChild(el("p","lede",r.lede));

  var f=el("div","h-facts");
  r.facts.forEach(function(x){
    var c=el("div","h-fact");
    c.appendChild(el("p","k",x.k));
    c.appendChild(el("p","v",x.v));
    c.appendChild(el("p","n",x.n));
    c.appendChild(src(x.s));
    f.appendChild(c);
  });
  m.appendChild(f);

  if (r.table){
    var w=el("div","h-tablewrap"), t=el("table","h-table");
    var th=document.createElement("thead");
    th.innerHTML="<tr><th>Kind of business</th><th>Pages</th><th>Back-office modules</th><th>Shape</th></tr>";
    t.appendChild(th);
    var tb=document.createElement("tbody");
    KINDS.forEach(function(k){
      var tr=document.createElement("tr");
      tr.appendChild(el("td",null,k[0]));
      tr.appendChild(el("td","num",String(k[1])));
      tr.appendChild(el("td","num",String(k[2])));
      var td=el("td","num");
      var bar=el("span","h-bar"); bar.style.width=(k[2]*9)+"px";
      td.appendChild(bar); td.appendChild(document.createTextNode(k[1]+" + "+k[2]));
      tr.appendChild(td);
      tb.appendChild(tr);
    });
    t.appendChild(tb); w.appendChild(t); m.appendChild(w);
    var note=el("p","h-note","Read down the module column rather than across the row — that is "
      + "where the kinds actually differ. Courses carry eleven modules; software and digital "
      + "products carry eight.");
    note.appendChild(document.createTextNode(" "));
    note.appendChild(src("gallery"));
    m.appendChild(note);
  }

  if (r.channels){
    var cw=el("div","h-tablewrap"), ct=el("table","h-table");
    var cth=document.createElement("thead");
    cth.innerHTML="<tr><th>Channel scored, every month</th><th>Same rubric</th><th>Run on competitors</th></tr>";
    ct.appendChild(cth);
    var ctb=document.createElement("tbody");
    CHANNELS.forEach(function(c){
      var tr=document.createElement("tr");
      tr.appendChild(el("td",null,c));
      tr.appendChild(el("td","num","yes"));
      tr.appendChild(el("td","num","yes"));
      ctb.appendChild(tr);
    });
    ct.appendChild(ctb); cw.appendChild(ct); m.appendChild(cw);
  }

  if (r.steps){
    var ol=el("ol","vk-steps"); ol.style.marginTop="var(--s4)";
    r.steps.forEach(function(s){
      var li=document.createElement("li");
      var p=el("p",null,s); li.appendChild(p); ol.appendChild(li);
    });
    m.appendChild(ol);
  }

  var a=el("a","h-open", r.linkText+" →");
  a.href=S[r.link].u; a.target="_blank"; a.rel="noopener";
  m.appendChild(a);
}

function moves(){
  var box=$("h-moves"); box.textContent="";
  function add(label,fn,quiet){
    var b=el("button","h-move"+(quiet?" h-move--quiet":""),label);
    b.type="button"; b.addEventListener("click",fn); box.appendChild(b);
  }
  var nextUnseen=-1;
  for (var i=0;i<ROOMS.length;i++) if(!seen[ROOMS[i].id]){ nextUnseen=i; break; }

  if (at+1 < ROOMS.length) add("Lead on → "+ROOMS[at+1].n, function(){ go(at+1,"next"); });
  if (nextUnseen>=0 && nextUnseen!==at+1)
    add("Take me to "+ROOMS[nextUnseen].n, function(){ go(nextUnseen,"skip"); }, true);
  if (at>0) add("Back to "+ROOMS[at-1].n, function(){ go(at-1,"back"); }, true);
  var n=0; for(var k in seen) if(seen[k]) n++;
  if (n===ROOMS.length) add("Start the walk again", function(){ seen={}; go(0,"restart"); }, true);
}

function say(html){ $("h-say").innerHTML = html; }

function go(i, how){
  at=i; var r=ROOMS[i];
  var first=!seen[r.id];
  seen[r.id]=true;
  paintMap(); paintRoom(); moves();

  var n=0; for(var k in seen) if(seen[k]) n++;
  var line = r.say;
  if (!first) line = "Back in "+r.n.toLowerCase()+". "+r.say;
  else if (how==="skip") line = "Straight there, then. "+r.say;
  if (n===ROOMS.length && first)
    line += " That's the whole house — <em>you've now seen all seven rooms and the office.</em>";
  say(line);

  var m=$("h-room");
  if (how!=="boot"){ m.focus({preventScroll:true}); m.scrollIntoView({block:"start"}); }
}

/* ---------------------------------------------------------------- the ask */
$("h-ask").addEventListener("submit", function(e){
  e.preventDefault();
  var q=$("h-q").value.trim();
  if(!q) { $("h-q").focus(); return; }
  asked++;
  for (var i=0;i<QA.length;i++){
    if (QA[i][0].test(q)){
      say(QA[i][1]);
      var room=QA[i][2];
      if (room){
        var box=$("h-moves"); box.textContent="";
        for (var j=0;j<ROOMS.length;j++){
          if (ROOMS[j].id===room){
            (function(idx){
              var b=el("h-move"===""?"button":"button","h-move","Show me — "+ROOMS[idx].n);
              b.type="button"; b.addEventListener("click",function(){ go(idx,"ask"); });
              box.appendChild(b);
            })(j);
          }
        }
        var back=el("button","h-move h-move--quiet","Stay here");
        back.type="button"; back.addEventListener("click",moves);
        box.appendChild(back);
      } else { moves(); }
      $("h-q").value="";
      return;
    }
  }
  say("That one's outside what I know. I'm scripted, so I'd rather say so than guess at you — "
    + "I can speak to what gets built, the eight channels, how a build runs, validating an idea "
    + "before building it, and how an engagement starts. <em>For anything else the studio's own "
    + "site is the place to ask a person.</em>");
  moves();
  $("h-q").value="";
});

/* ---------------------------------------------------------------- theme */
$("h-theme").addEventListener("click", function(){
  var d=document.documentElement;
  var now=d.getAttribute("data-theme")
    || (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark":"light");
  var next = now==="dark" ? "light":"dark";
  d.setAttribute("data-theme",next);
  try{ localStorage.setItem("vom.house.theme",next); }catch(e){}
  this.textContent = next==="dark" ? "Light":"Dark";
});
(function(){
  var d=document.documentElement.getAttribute("data-theme");
  if(!d && window.matchMedia) d = matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
  $("h-theme").textContent = d==="dark" ? "Light":"Dark";
})();

go(0,"boot");
})();
</script>
