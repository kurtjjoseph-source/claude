<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turnkey — Launch OS</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/jpeg" href="{{LOGO}}">
<style>
  :root{
    --navy:#1B2A4A; --orange:#E8843C; --teal:#2FA8A0;
    --bg:#f7f6f3; --surface:#ffffff; --line:#e2e0d6; --ink:#1B2233; --ink-dim:#535b66; --ink-faint:#868f99;
    --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,monospace;
    --sans:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0d1117; --surface:#151b24; --line:#28323f; --ink:#eef2f7; --ink-dim:#a4b0bd; --ink-faint:#6d7987; }
  }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; display:grid; place-items:center; padding:26px;
        background:var(--bg); color:var(--ink); font-family:var(--sans); line-height:1.55; }
  .box{ width:100%; max-width:430px; background:var(--surface); border:1px solid var(--line);
        border-radius:16px; padding:30px 28px; }
  .lock{ display:flex; align-items:center; gap:13px; margin-bottom:20px; }
  .lock img{ width:44px; height:44px; border-radius:10px; background:#fff; border:1px solid var(--line); object-fit:cover; }
  .eyebrow{ font-family:var(--mono); font-size:11px; letter-spacing:.2em; text-transform:uppercase;
            color:var(--orange); margin:0; }
  h1{ margin:0; font-size:21px; letter-spacing:-.02em; }
  p{ color:var(--ink-dim); font-size:14.5px; }
  label{ display:block; font-family:var(--mono); font-size:11px; letter-spacing:.06em;
         text-transform:uppercase; color:var(--ink-faint); font-weight:700; margin:18px 0 6px; }
  input{ width:100%; background:var(--bg); color:var(--ink); border:1px solid var(--line);
         border-radius:10px; padding:11px 13px; font-family:var(--mono); font-size:14px; }
  input:focus{ outline:2px solid var(--orange); outline-offset:1px; }
  button{ width:100%; margin-top:14px; border:1px solid var(--orange); background:var(--orange);
          color:#1b1206; font:inherit; font-weight:700; padding:11px; border-radius:10px; cursor:pointer; }
  button:hover{ filter:brightness(1.06); }
  button[disabled]{ opacity:.5; cursor:progress; }
  .err{ color:#c0553f; font-size:13.5px; min-height:20px; margin:10px 0 0; }
  .foot{ margin-top:22px; padding-top:16px; border-top:1px solid var(--line);
         font-size:13px; color:var(--ink-faint); }
  .foot a{ color:var(--teal); }
</style>
</head>
<body>
<main class="box">
  <div class="lock">
    <img src="{{LOGO}}" alt="Vision Outreach Media" width="88" height="88">
    <div><p class="eyebrow">Vision Outreach Media</p><h1>Turnkey · Launch OS</h1></div>
  </div>

  <p>This is the operating system, not the brochure. It runs and remembers live launches, so it
  opens with a licence key.</p>

  <form id="f" autocomplete="off">
    <label for="k">Licence key</label>
    <input id="k" name="key" type="text" inputmode="text" spellcheck="false"
           placeholder="paste the key from your licence or receipt" autofocus>
    <button type="submit" id="go">Unlock the OS</button>
    <p class="err" id="err" role="alert"></p>
  </form>

  <div class="foot">
    No key? <a href="/">See what Turnkey is</a> — the explainer is public, and the licence page
    tells you how to get one.
  </div>
</main>
<script>
  var f = document.getElementById("f"), err = document.getElementById("err"), go = document.getElementById("go");
  f.addEventListener("submit", async function(e){
    e.preventDefault();
    err.textContent = ""; go.disabled = true; go.textContent = "Checking…";
    try{
      var r = await fetch("/api/unlock", { method:"POST", headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ key: document.getElementById("k").value.trim() }), credentials:"same-origin" });
      var d = await r.json();
      if (d && d.ok){ location.reload(); return; }
      err.textContent = (d && d.error) || "That key didn't unlock anything.";
    } catch(_){ err.textContent = "Couldn't reach the gate. Try again."; }
    go.disabled = false; go.textContent = "Unlock the OS";
  });
</script>
</body>
</html>
